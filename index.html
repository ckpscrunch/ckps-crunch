                <form onSubmit={handleDetailsSubmit} className="p-6 space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-stone-700 mb-1">Full Name *</label>
                      <input
                        type="text"
                        required
                        value={checkoutForm.fullName}
                        onChange={(e) => setCheckoutForm({ ...checkoutForm, fullName: e.target.value })}
                        placeholder="e.g. Ramesh Patil"
                        className="w-full border rounded-xl px-3 py-2"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-stone-700 mb-1">WhatsApp / Mobile *</label>
                      <input
                        type="tel"
                        required
                        value={checkoutForm.mobile}
                        onChange={(e) => setCheckoutForm({ ...checkoutForm, mobile: e.target.value })}
                        placeholder="10-digit number"
                        className="w-full border rounded-xl px-3 py-2"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-stone-700 mb-1">Street Address (House/Flat, Road, Area) *</label>
                    <input
                      type="text"
                      required
                      value={checkoutForm.streetAddress}
                      onChange={(e) => setCheckoutForm({ ...checkoutForm, streetAddress: e.target.value })}
                      placeholder="Flat 102, Beach View Apts..."
                      className="w-full border rounded-xl px-3 py-2"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-stone-700 mb-1">Landmark</label>
                      <input
                        type="text"
                        value={checkoutForm.landmark}
                        onChange={(e) => setCheckoutForm({ ...checkoutForm, landmark: e.target.value })}
                        placeholder="Near Temple"
                        className="w-full border rounded-xl px-3 py-2"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-stone-700 mb-1">City *</label>
                      <input
                        type="text"
                        required
                        value={checkoutForm.city}
                        onChange={(e) => setCheckoutForm({ ...checkoutForm, city: e.target.value })}
                        placeholder="Mumbai"
                        className="w-full border rounded-xl px-3 py-2"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-stone-700 mb-1">Pincode *</label>
                      <input
                        type="text"
                        required
                        maxLength="6"
                        value={checkoutForm.pincode}
                        onChange={(e) => setCheckoutForm({ ...checkoutForm, pincode: e.target.value })}
                        placeholder="400001"
                        className="w-full border rounded-xl px-3 py-2"
                      />
                    </div>
                  </div>

                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-[11px] text-amber-900 flex items-center gap-2">
                    <span className="text-base">🔒</span>
                    <div>
                      <strong>Prepaid Orders Only:</strong> Payment via instant UPI / QR Code. Cash on Delivery (COD) is not accepted.
                    </div>
                  </div>

                  <div className="pt-3 border-t flex items-center justify-between">
                    <div>
                      <div className="text-xs text-stone-500">Order Total:</div>
                      <div className="text-xl font-black text-stone-900">₹{cartTotal}</div>
                    </div>
                    <button
                      type="submit"
                      className="bg-sky-800 hover:bg-sky-900 text-white font-black px-6 py-3 rounded-xl shadow-md transition"
                    >
                      Proceed to Instant Payment →
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* ================= STEP 2: AUTO PAYMENT GATEWAY (AUTO-FETCH & QR) ================= */}
          {showAutoPaymentGatewayModal && pendingOrder && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-stone-200 text-center space-y-4 p-6">
                
                {/* Header */}
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-brand font-black text-xl text-stone-900">CKP Auto Payment Gateway</h3>
                    <p className="text-[11px] text-stone-500">Auto-detecting payment like Amazon Pay</p>
                  </div>
                  <button onClick={() => setShowAutoPaymentGatewayModal(false)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                {/* Amount Highlight */}
                <div className="bg-sky-50 p-3 rounded-2xl border border-sky-200">
                  <div className="text-xs text-sky-900 font-semibold">Total Payable Amount:</div>
                  <div className="text-3xl font-black text-sky-950">₹{pendingOrder.total}</div>
                  <div className="text-[10px] text-sky-700 font-mono mt-0.5">UPI ID: {ownerConfig.upiId}</div>
                </div>

                {/* DYNAMIC QR CODE FOR THIS ORDER */}
                <div className="relative inline-block p-3 bg-white rounded-2xl shadow-md border-2 border-dashed border-sky-400">
                  <img src={upiQrUrl} alt="Order QR Code" className="w-48 h-48 mx-auto rounded-lg" />
                  
                  {paymentStep === "detecting" && (
                    <div className="absolute inset-0 bg-white/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-4">
                      <div className="w-12 h-12 border-4 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
                      <div className="font-bold text-sky-900 text-xs mt-3">Auto-Fetching Payment Status...</div>
                      <div className="text-[10px] text-stone-500">Verifying transaction with bank network</div>
                    </div>
                  )}

                  {paymentStep === "confirmed" && (
                    <div className="absolute inset-0 bg-emerald-50/95 rounded-2xl flex flex-col items-center justify-center p-4">
                      <div className="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center text-2xl font-bold">✓</div>
                      <div className="font-bold text-emerald-900 text-sm mt-2">Payment Confirmed!</div>
                    </div>
                  )}
                </div>

                {/* Auto Status Bar */}
                <div className="space-y-2">
                  <div className="flex items-center justify-center gap-2 text-xs font-bold text-stone-600">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>Live Listening for Payment... ({Math.floor(paymentTimer / 60)}:{(paymentTimer % 60).toString().padStart(2, '0')})</span>
                  </div>

                  {/* Deep link for mobile users */}
                  <a
                    href={dynamicUpiUri}
                    onClick={() => setTimeout(triggerAutoPaymentConfirmation, 3000)}
                    className="block bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl shadow text-xs"
                  >
                    ⚡ Tap to Pay via GPay / PhonePe / Paytm
                  </a>

                  {/* Manual trigger button for desktop testers */}
                  <button
                    onClick={triggerAutoPaymentConfirmation}
                    className="w-full bg-sky-900 hover:bg-sky-950 text-white font-bold py-2 rounded-xl text-xs shadow"
                  >
                    Paid via UPI App? Click to Auto-Verify & Confirm
                  </button>
                </div>

              </div>
            </div>
          )}


          {/* ================= ORDER CONFIRMATION MODAL ================= */}
          {orderSuccessData && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 text-center space-y-4">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                  ✓
                </div>
                <h3 className="font-brand font-black text-2xl text-stone-900">Order Confirmed! 🙏</h3>
                <p className="text-xs text-stone-500">Order #{orderSuccessData.orderId} • Status: {orderSuccessData.status}</p>

                <div className="bg-stone-50 p-4 rounded-2xl border text-left text-xs space-y-2">
                  <div className="font-bold text-stone-900">{orderSuccessData.customer.fullName} ({orderSuccessData.customer.mobile})</div>
                  <div className="text-stone-600 text-[11px]">{orderSuccessData.customer.streetAddress}, {orderSuccessData.customer.city} - {orderSuccessData.customer.pincode}</div>
                  <div className="border-t pt-2 space-y-1">
                    {orderSuccessData.items.map(i => (
                      <div key={i.id} className="flex justify-between text-stone-700">
                        <span>{i.name} ({i.size}) x{i.quantity}</span>
                        <span className="font-bold">₹{i.price * i.quantity}</span>
                      </div>
                    ))}
                  </div>
                  <div className="border-t pt-2 flex justify-between font-black text-sm text-stone-900">
                    <span>Total Paid</span>
                    <span>₹{orderSuccessData.total}</span>
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="flex-1 py-2.5 border rounded-xl font-bold text-xs hover:bg-stone-50 transition">🖨️ Print Receipt</button>
                    <button onClick={() => setOrderSuccessData(null)} className="flex-1 py-2.5 bg-stone-900 text-white rounded-xl font-bold text-xs hover:bg-stone-800 transition">Continue Shopping</button>
                  </div>

                  {orderSuccessData.status !== "Cancelled by Customer" ? (
                    <button
                      type="button"
                      onClick={() => handleCancelCustomerOrder(orderSuccessData.orderId)}
                      className="w-full py-2.5 border border-red-300 bg-red-50/70 hover:bg-red-100 text-red-700 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 shadow-xs"
                    >
                      <span>❌</span>
                      <span>Cancel This Order</span>
                    </button>
                  ) : (
                    <div className="bg-red-50 border border-red-200 text-red-800 p-2.5 rounded-xl text-xs font-bold text-center">
                      ❌ Order Cancelled on {orderSuccessData.cancelledAt || "Recently"}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= CUSTOMER TRACK & CANCEL ORDER MODAL ================= */}
          {showTrackOrderModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-sky-100 text-sky-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">Customer Care</span>
                    <h3 className="font-brand font-black text-xl text-stone-900 mt-1">Track or Cancel Your Order</h3>
                  </div>
                  <button onClick={() => setShowTrackOrderModal(false)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">&times;</button>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-xs font-bold text-stone-700">Enter Your Order ID or 10-Digit Mobile Number:</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={trackSearchInput}
                      onChange={(e) => setTrackSearchInput(e.target.value)}
                      placeholder="e.g. ORD-123456 or 9820011223"
                      className="flex-1 border rounded-xl px-3.5 py-2.5 text-xs font-bold font-mono focus:ring-2 focus:ring-sky-700 uppercase"
                    />
                    <button
                      type="button"
                      onClick={() => {
                        const clean = trackSearchInput.trim().toUpperCase();
                        if (!clean) return;
                        const found = orders.find(o => o.orderId.toUpperCase() === clean || (o.customer && o.customer.mobile && o.customer.mobile.replace(/\D/g, '').includes(clean)));
                        if (found) {
                          setTrackedOrder(found);
                        } else {
                          alert("No order found with that Order ID or Mobile Number. Please check your order confirmation.");
                          setTrackedOrder(null);
                        }
                      }}
                      className="bg-sky-900 hover:bg-sky-800 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition"
                    >
                      Find Order
                    </button>
                  </div>
                </div>

                {trackedOrder ? (
                  <div className="bg-stone-50 rounded-2xl p-4 border border-stone-200 space-y-3 text-xs">
                    <div className="flex justify-between items-start border-b pb-2">
                      <div>
                        <div className="font-black text-sm text-stone-900">{trackedOrder.orderId}</div>
                        <div className="text-[11px] text-stone-500">Placed on {trackedOrder.date} at {trackedOrder.time || "Recently"}</div>
                      </div>
                      <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] ${
                        trackedOrder.status === "Cancelled by Customer"
                          ? "bg-red-100 text-red-900 border border-red-300"
                          : "bg-emerald-100 text-emerald-900"
                      }`}>
                        {trackedOrder.status === "Cancelled by Customer" ? "❌ Cancelled" : trackedOrder.status}
                      </span>
                    </div>

                    <div className="space-y-1 text-stone-700">
                      <div><strong>Customer:</strong> {trackedOrder.customer.fullName} ({trackedOrder.customer.mobile})</div>
                      <div><strong>Delivery Address:</strong> {trackedOrder.customer.streetAddress}, {trackedOrder.customer.city} - {trackedOrder.customer.pincode}</div>
                      <div><strong>Items:</strong> {trackedOrder.items.map(i => `${i.name} (${i.size}) x${i.quantity}`).join(", ")}</div>
                      <div className="font-bold text-stone-900 pt-1 border-t flex justify-between">
                        <span>Total Paid:</span>
                        <span>₹{trackedOrder.total}</span>
                      </div>
                    </div>

                    {trackedOrder.status === "Cancelled by Customer" ? (
                      <div className="bg-red-50 border border-red-200 text-red-800 p-2.5 rounded-xl text-xs font-semibold">
                        <strong>Order Status:</strong> Cancelled by Customer on {trackedOrder.cancelledAt || "Recently"}.
                        {trackedOrder.cancellationReason && <div>Reason: "{trackedOrder.cancellationReason}"</div>}
                      </div>
                    ) : (
                      <div className="space-y-3 pt-1">
                        <div className="bg-white p-3 rounded-xl border border-stone-200 space-y-1.5">
                          <div className="text-[11px] font-bold text-stone-700 flex justify-between">
                            <span>Delivery Status:</span>
                            <span className="text-amber-800 font-extrabold">{trackedOrder.status.replace(" (Auto-Verified)", "")}</span>
                          </div>
                          <div className="grid grid-cols-4 gap-1 text-center pt-1">
                            {["Packed", "Dispatched", "Out for Delivery", "Delivered"].map((st, idx) => {
                              const stepOrder = ["Payment Confirmed", "Packed", "Dispatched", "Out for Delivery", "Delivered"];
                              const curName = trackedOrder.status.replace(" (Auto-Verified)", "");
                              const currentIdx = stepOrder.indexOf(curName);
                              const isDone = currentIdx >= (idx + 1);
                              return (
                                <div key={st} className={`p-1.5 rounded-lg text-[10px] font-bold border transition ${
                                  isDone ? "bg-emerald-100 text-emerald-900 border-emerald-300" : "bg-stone-50 text-stone-400 border-stone-200"
                                }`}>
                                  {isDone ? "&#10003; " : ""}{st}
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        <div>
                          <button
                            type="button"
                            onClick={() => handleCancelCustomerOrder(trackedOrder.orderId)}
                            className="w-full py-2.5 bg-red-50 hover:bg-red-100 border border-red-300 text-red-700 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 shadow-xs"
                          >
                            <span>&#10060;</span>
                            <span>Cancel This Order</span>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <p className="text-[11px] text-stone-500 text-center py-4">
                    Enter your Order ID (from receipt) or Phone Number to view status or cancel an order.
                  </p>
                )}

                <div className="border-t pt-2">
                  <button
                    type="button"
                    onClick={() => setShowTrackOrderModal(false)}
                    className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-xl font-bold text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ================= SAME UNIFIED LOGIN MODAL ================= */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-brand font-black text-xl text-stone-900">
                      {isRegisterMode ? "Create Customer Account" : "Sign In to CKP's Crunch"}
                    </h3>
                    <p className="text-xs text-stone-500">Unified portal for Customers & Owner</p>
                  </div>
                  <button onClick={() => { setShowLoginModal(false); setLoginError(""); }} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                {loginError && (
                  <p className="bg-red-50 text-red-700 p-2.5 rounded-xl text-xs font-bold border border-red-200">{loginError}</p>
                )}

                <form onSubmit={handleUnifiedLogin} className="space-y-3.5 text-xs text-left">
                  {isRegisterMode && (
                    <div>
                      <label className="block font-bold text-stone-700 mb-1">Your Full Name *</label>
                      <input
                        type="text"
                        required
                        value={loginName}
                        onChange={(e) => setLoginName(e.target.value)}
                        placeholder="e.g. Anand Kulkarni"
                        className="w-full border rounded-xl px-3 py-2"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-stone-700 mb-1">Mobile Number / User ID *</label>
                    <input
                      type="text"
                      required
                      autoFocus
                      value={loginId}
                      onChange={(e) => setLoginId(e.target.value)}
                      placeholder="Enter Mobile Number or ID"
                      className="w-full border rounded-xl px-3 py-2 font-semibold"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-stone-700 mb-1">Password *</label>
                    <input
                      type="password"
                      required
                      value={loginPass}
                      onChange={(e) => setLoginPass(e.target.value)}
                      placeholder="Enter Password"
                      className="w-full border rounded-xl px-3 py-2 font-semibold"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-sky-800 hover:bg-sky-900 text-white font-bold py-2.5 rounded-xl shadow mt-2 text-xs"
                  >
                    {isRegisterMode ? "Register & Sign In" : "Sign In"}
                  </button>

                  <div className="pt-2 text-center text-[11px] text-stone-500">
                    {isRegisterMode ? (
                      <span>Already have an account? <button type="button" onClick={() => { setIsRegisterMode(false); setLoginError(""); }} className="font-bold text-sky-800 underline">Sign In</button></span>
                    ) : (
                      <span>New customer? <button type="button" onClick={() => { setIsRegisterMode(true); setLoginError(""); }} className="font-bold text-sky-800 underline">Register with Mobile</button></span>
                    )}
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* ================= PROFILE & PASSWORD CHANGE MODAL (OWNER & USER) ================= */}
          {showProfileModal && currentUser && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-brand font-black text-lg text-stone-900">
                    {currentUser.role === "owner" ? "🔑 Change Owner ID & Password" : "👤 My Profile Settings"}
                  </h3>
                  <button onClick={() => setShowProfileModal(false)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveProfile} className="space-y-3 text-xs text-left">
                  {currentUser.role === "owner" ? (
                    <>
                      <div>
                        <label className="block font-bold text-stone-700 mb-1">Owner User ID</label>
                        <input
                          type="text"
                          required
                          value={profileForm.id}
                          onChange={(e) => setProfileForm({ ...profileForm, id: e.target.value })}
                          className="w-full border rounded-xl px-3 py-2 font-bold"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-stone-700 mb-1">New Owner Password</label>
                        <input
                          type="password"
                          required
                          value={profileForm.password}
                          onChange={(e) => setProfileForm({ ...profileForm, password: e.target.value })}
                          placeholder="Enter new password"
                          className="w-full border rounded-xl px-3 py-2 font-bold"
                        />
                      </div>
                    </>
                  ) : (
                    <>
                      <div>
                        <label className="block font-bold text-stone-700 mb-1">Your Name</label>
                        <input
                          type="text"
                          required
                          value={profileForm.name}
                          onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                          className="w-full border rounded-xl px-3 py-2"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-stone-700 mb-1">New Password</label>
                        <input
                          type="password"
                          required
                          value={profileForm.password}
                          onChange={(e) => setProfileForm({ ...profileForm, password: e.target.value })}
                          placeholder="Enter new password"
                          className="w-full border rounded-xl px-3 py-2"
                        />
                      </div>
                    </>
                  )}

                  <div className="pt-2">
                    <button type="submit" className="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-2 rounded-xl shadow">
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* ================= SLIDE-OUT CART ================= */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between">
                <div className="p-4 border-b flex items-center justify-between bg-stone-50">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🛍️</span>
                    <h3 className="font-brand font-black text-lg text-stone-900">Your Fresh Cart</h3>
                    <span className="bg-sky-100 text-sky-900 text-xs px-2 py-0.5 rounded-full font-bold">
                      {totalItemsCount} items
                    </span>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {cart.length === 0 ? (
                    <div className="text-center py-16 text-stone-400">
                      <span className="text-5xl">🌊</span>
                      <p className="font-bold text-stone-700 mt-2 text-sm">Your cart is empty!</p>
                      <p className="text-xs text-stone-500">Pick some fresh crispy fish, spices, or barni pickles.</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex gap-3 bg-stone-50 p-3 rounded-2xl border">
                        <img src={item.image} className="w-16 h-16 rounded-xl object-cover border" />
                        <div className="flex-1 flex flex-col justify-between">
                          <div>
                            <div className="flex justify-between items-start">
                              <h4 className="font-bold text-xs text-stone-900">{item.name}</h4>
                              <button onClick={() => removeCartItem(item.id)} className="text-stone-400 hover:text-red-600 text-xs font-bold ml-1">✕</button>
                            </div>
                            <span className="text-[11px] text-sky-800 font-semibold">{item.size}</span>
                          </div>
                          <div className="flex justify-between items-center pt-1">
                            <span className="font-black text-sm text-stone-900">₹{item.price * item.quantity}</span>
                            <div className="flex items-center border rounded-lg bg-white overflow-hidden text-xs">
                              <button onClick={() => updateCartQty(item.id, -1)} className="px-2 py-1 font-bold">-</button>
                              <span className="px-2 font-bold">{item.quantity}</span>
                              <button onClick={() => updateCartQty(item.id, 1)} className="px-2 py-1 font-bold">+</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-4 border-t bg-stone-50 space-y-3">
                    <div className="space-y-1 text-xs text-stone-600">
                      <div className="flex justify-between"><span>Items Subtotal</span><span>₹{cartSubtotal}</span></div>
                      <div className="flex justify-between"><span>Courier Delivery</span><span>₹{shippingCharge}</span></div>
                      <div className="flex justify-between text-stone-900 font-extrabold text-base pt-1 border-t">
                        <span>Total</span><span>₹{cartTotal}</span>
                      </div>
                    </div>

                    <button
                      onClick={startCheckout}
                      className="w-full bg-sky-800 hover:bg-sky-900 text-white font-black py-3 rounded-2xl shadow transition text-sm"
                    >
                      Checkout (₹{cartTotal})
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}


          {/* ================= OWNER IN-PLACE TEXT QUICK EDITOR MODAL ================= */}
          {editingTextModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-amber-100 text-amber-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">Owner Text Editor</span>
                    <h3 className="font-brand font-black text-lg text-stone-900 mt-1">Edit: {editingTextModal.label}</h3>
                  </div>
                  <button onClick={() => setEditingTextModal(null)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Sentence / Tagline Content:</label>
                  <textarea
                    rows={editingTextModal.value.length > 60 ? 4 : 2}
                    value={editingTextModal.value}
                    onChange={(e) => setEditingTextModal({ ...editingTextModal, value: e.target.value })}
                    className="w-full border-2 border-amber-300 focus:border-amber-600 rounded-xl p-3 text-xs font-medium focus:outline-none"
                    autoFocus
                  />
                  <div className="text-[10px] text-stone-400 mt-1">Changes are saved live across the entire website and saved permanently in your browser.</div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setEditingTextModal(null)}
                    className="flex-1 py-2.5 border rounded-xl font-bold text-xs text-stone-600 hover:bg-stone-50"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setSiteContent(prev => ({ ...prev, [editingTextModal.key]: editingTextModal.value })); setHasUnpublishedChanges(true);
                      setEditingTextModal(null);
                    }}
                    className="flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-xs shadow"
                  >
                    Save Line & Update Live ✓
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ================= FULL PRODUCT DETAIL PAGE & EDITABLE REVIEWS MODAL ================= */}
          {!activeProductDetail && quickViewProduct && (() => {
            const currentVariant = quickViewProduct.variants[detailVariantIdx] || quickViewProduct.variants[0];
            const hasDiscount = currentVariant && currentVariant.originalPrice && currentVariant.originalPrice > currentVariant.price;
            const discountPct = hasDiscount ? Math.round(((currentVariant.originalPrice - currentVariant.price) / currentVariant.originalPrice) * 100) : 0;
            const relatedProducts = products.filter(p => p.id !== quickViewProduct.id).slice(0, 4);

            return (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 animate-fadeIn">
                <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[92vh] overflow-y-auto shadow-2xl border border-stone-200">
                  {/* Modal Sticky Top Bar */}
                  <div className="sticky top-0 bg-white/95 backdrop-blur-md z-20 px-6 py-4 border-b flex items-center justify-between">
                    <div className="flex items-center gap-2 text-xs font-bold text-stone-500">
                      <button
                        onClick={() => setQuickViewProduct(null)}
                        className="hover:text-stone-900 flex items-center gap-1 bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-xl transition"
                      >
                        &larr; Back to Store
                      </button>
                      <span className="text-stone-300">/</span>
                      <span className="text-sky-800 font-bold">{quickViewProduct.category}</span>
                      <span className="text-stone-300">/</span>
                      <span className="text-stone-900 truncate max-w-[150px] sm:max-w-xs">{quickViewProduct.name}</span>
                    </div>

                    <button
                      onClick={() => setQuickViewProduct(null)}
                      className="bg-stone-100 hover:bg-stone-200 text-stone-700 w-9 h-9 rounded-full font-bold flex items-center justify-center transition shadow-sm"
                    >
                      &#10005;
                    </button>
                  </div>

                  {/* Owner & Staff Edit Bar (Visible when Owner or Employee is Logged In) */}
                  {isEditor && (
                    <div className="bg-amber-400 text-stone-950 px-6 py-2.5 flex flex-wrap items-center justify-between text-xs font-bold border-b border-amber-500 shadow-sm">
                      <div className="flex items-center gap-2">
                        <span>&#9998; Staff / Owner Editor Active:</span>
                        <span className="font-medium text-stone-800 hidden sm:inline">You can modify photos, product details, cooking tips, and reviews below.</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setEditingProductModal({ ...quickViewProduct })}
                          className="bg-stone-950 text-amber-300 hover:bg-stone-800 px-3 py-1 rounded-xl text-xs font-black shadow flex items-center gap-1 transition"
                        >
                          <span>&#9998; Edit Product Details &amp; Prices</span>
                        </button>
                        <button
                          onClick={() => {
                            setEditingImageModal({
                              key: `product:${quickViewProduct.id}`,
                              label: `Photo for ${quickViewProduct.name}`,
                              currentUrl: quickViewProduct.image
                            });
                          }}
                          className="bg-sky-900 text-white hover:bg-sky-950 px-3 py-1 rounded-xl text-xs font-bold shadow flex items-center gap-1 transition"
                        >
                          <span>&#128247; Change Photo</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Top 2-Column Product Showcase */}
                  <div className="p-6 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 border-b">
                    {/* Left Column: Image & Badges */}
                    <div className="space-y-4">
                      <div className="relative h-80 sm:h-96 rounded-3xl overflow-hidden bg-stone-100 border shadow-inner group">
                        <img
                          src={quickViewProduct.image}
                          alt={quickViewProduct.name}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute top-4 left-4 flex flex-col gap-2">
                          <span className="bg-stone-900/90 text-amber-200 font-bold text-xs px-3 py-1 rounded-full shadow-lg backdrop-blur-sm">
                            {quickViewProduct.tag}
                          </span>
                          {quickViewProduct.isTopSeller && (
                            <span className="bg-amber-500 text-white font-black text-xs px-3 py-1 rounded-full shadow-lg">
                              &#128293; Top Selling
                            </span>
                          )}
                        </div>

                        <div className="absolute bottom-4 left-4 right-4 flex items-center justify-between bg-black/60 backdrop-blur-md px-3.5 py-2 rounded-2xl text-white text-xs">
                          <span>&#127798; Spice Level: {quickViewProduct.spiceLevel}/5</span>
                          <span>&#11088; {quickViewProduct.rating || 5.0} ({quickViewProduct.reviewsCount || 340} reviews)</span>
                        </div>
                      </div>

                      {/* Trust Highlights Checklist */}
                      <div className="grid grid-cols-2 gap-2 text-[11px] font-semibold text-stone-600 bg-stone-50 p-3.5 rounded-2xl border">
                        <div className="flex items-center gap-1.5">
                          <span className="text-amber-500">&#9728;</span> 100% Bamboo Sun-Dried
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-emerald-500">&#128737;</span> Zero Artificial Chemicals
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-sky-500">&#128230;</span> Food-Grade Vacuum Lock
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-indigo-500">&#9889;</span> Express Fast Delivery
                        </div>
                      </div>
                    </div>

                    {/* Right Column: Pricing, Variants, Actions */}
                    <div className="space-y-5 flex flex-col justify-between">
                      <div className="space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-black text-sky-800 uppercase tracking-widest bg-sky-50 px-2.5 py-1 rounded-md">
                            {quickViewProduct.category}
                          </span>
                          {isEditor && (
                            <button
                              onClick={() => setEditingProductModal({ ...quickViewProduct })}
                              className="text-xs text-amber-700 hover:underline font-bold"
                            >
                              &#9998; Quick Edit
                            </button>
                          )}
                        </div>
                        <h2 className="font-brand font-black text-2xl sm:text-3xl text-stone-900 leading-tight">
                          {quickViewProduct.name}
                        </h2>
                        <p className="text-xs sm:text-sm text-stone-500 italic font-medium">
                          "{quickViewProduct.tagline}"
                        </p>

                        {/* Ratings & Social Proof Bar */}
                        <div className="flex items-center gap-2 pt-1">
                          <div className="flex text-amber-400 text-sm">
                            {"&#9733;".repeat(Math.floor(quickViewProduct.rating || 5))}
                          </div>
                          <span className="text-xs font-bold text-stone-800">{quickViewProduct.rating || 5.0} / 5.0</span>
                          <span className="text-xs text-stone-400"> &bull; </span>
                          <span className="text-xs text-emerald-700 font-bold underline cursor-pointer">
                            {quickViewProduct.reviewsCount || 340} Verified Customer Reviews
                          </span>
                        </div>
                      </div>

                      {/* Pricing with Discount */}
                      <div className="bg-amber-50/70 p-4 rounded-2xl border border-amber-200/80 space-y-1">
                        <div className="flex items-baseline gap-3">
                          <span className="text-3xl font-black text-stone-900">&#8377;{currentVariant?.price}</span>
                          {hasDiscount && (
                            <span className="text-base text-stone-400 line-through">&#8377;{currentVariant.originalPrice}</span>
                          )}
                          {hasDiscount && (
                            <span className="bg-emerald-600 text-white text-[11px] font-black px-2 py-0.5 rounded-full">
                              Save {discountPct}%
                            </span>
                          )}
                        </div>
                        <p className="text-[11px] text-stone-500">Inclusive of all local taxes  &bull;  Fresh coastal batch</p>
                      </div>

                      {/* Variant Selector */}
                      <div className="space-y-2">
                        <label className="block text-xs font-bold text-stone-700">Select Packaging Weight / Size:</label>
                        <div className="grid grid-cols-2 gap-2">
                          {quickViewProduct.variants.map((v, idx) => (
                            <button
                              key={idx}
                              onClick={() => {
                                setDetailVariantIdx(idx);
                                setSelectedVariants(prev => ({ ...prev, [quickViewProduct.id]: idx }));
                              }}
                              className={`py-2.5 px-3 rounded-xl border text-left transition ${
                                detailVariantIdx === idx
                                  ? "border-sky-800 bg-sky-50 ring-2 ring-sky-700 font-bold text-sky-950"
                                  : "border-stone-200 bg-white text-stone-700 hover:bg-stone-50"
                              }`}
                            >
                              <div className="text-xs font-black">{v.weight || v.size}</div>
                              <div className="text-[11px] text-stone-500">₹{v.price} {v.originalPrice && <span className="line-through">₹{v.originalPrice}</span>}</div>
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Quantity & Add to Cart */}
                      <div className="space-y-3 pt-2">
                        <div className="flex items-center justify-between">
                          <div className="text-xs font-bold text-stone-700">Quantity:</div>
                          <div className="flex items-center border border-stone-300 rounded-xl overflow-hidden bg-white shadow-sm">
                            <button
                              onClick={() => setDetailQty(Math.max(1, detailQty - 1))}
                              className="px-3 py-1.5 text-stone-600 hover:bg-stone-100 font-bold"
                            >
                              -
                            </button>
                            <span className="px-4 py-1.5 text-xs font-black text-stone-900">{detailQty}</span>
                            <button
                              onClick={() => setDetailQty(detailQty + 1)}
                              className="px-3 py-1.5 text-stone-600 hover:bg-stone-100 font-bold"
                            >
                              +
                            </button>
                          </div>
                        </div>

                        <div className="flex items-center justify-between text-xs text-stone-500">
                          <span>Total Amount: <strong className="text-stone-900 text-sm">&#8377;{(currentVariant?.price || 0) * detailQty}</strong></span>
                          <span className="text-emerald-700 font-bold">&#128994; In Stock ({quickViewProduct.stock} units available)</span>
                        </div>

                        <button
                          onClick={() => {
                            for (let i = 0; i < detailQty; i++) {
                              addToCart(quickViewProduct, detailVariantIdx);
                            }
                            if (window.confetti) {
                              window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                            }
                            setQuickViewProduct(null);
                          }}
                          disabled={quickViewProduct.stock <= 0}
                          className="w-full bg-sky-800 hover:bg-sky-900 disabled:bg-stone-300 text-white font-black py-4 px-6 rounded-2xl text-sm shadow-xl flex items-center justify-center gap-2 transform active:scale-95 transition"
                        >
                          <span>&#128722; Add {detailQty > 1 ? `${detailQty} Units` : ""} to Cart  &bull;  &#8377;{(currentVariant?.price || 0) * detailQty}</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Middle Section: Origin, Preparation & Cooking Tips */}
                  <div className="p-6 sm:p-8 bg-stone-50 border-b space-y-6">
                    <div className="flex items-center justify-between">
                      <h3 className="font-brand font-black text-xl text-stone-900">
                        &#127754; Authentic Product Story & Culinary Heritage
                      </h3>
                      {isEditor && (
                        <button
                          onClick={() => setEditingProductModal({ ...quickViewProduct })}
                          className="text-xs bg-amber-100 text-amber-900 font-bold px-3 py-1 rounded-xl border border-amber-300 hover:bg-amber-200 transition"
                        >
                          &#9998; Edit Culinary Details
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-1">
                        <div className="text-xs font-bold text-sky-800 uppercase flex items-center gap-1.5">
                          <span>&#128205;</span> Coastal Origin
                        </div>
                        <p className="text-xs text-stone-700 font-medium">
                          {quickViewProduct.origin || "Alibaug & Ratnagiri Coastline, Maharashtra"}
                        </p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-1">
                        <div className="text-xs font-bold text-amber-800 uppercase flex items-center gap-1.5">
                          <span>&#127994;</span> Traditional Curing
                        </div>
                        <p className="text-xs text-stone-700 font-medium">
                          {quickViewProduct.preparation || quickViewProduct.description}
                        </p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-1">
                        <div className="text-xs font-bold text-emerald-800 uppercase flex items-center gap-1.5">
                          <span>&#127859;</span> Best Cooking Style
                        </div>
                        <p className="text-xs text-stone-700 font-medium">
                          {quickViewProduct.cookTips || "Crispy tawa shallow fry or simmered in authentic coastal coconut rassa."}
                        </p>
                      </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl border shadow-sm">
                      <h4 className="text-xs font-bold text-stone-900 uppercase tracking-wider mb-1">Detailed Description:</h4>
                      <p className="text-xs text-stone-600 leading-relaxed">{quickViewProduct.description}</p>
                    </div>
                  </div>

                  {/* Customer Reviews Section */}
                  <div className="p-6 sm:p-8 border-b space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <h3 className="font-brand font-black text-xl text-stone-900 flex items-center gap-2">
                          <span>&#11088; Customer Reviews & Feedback</span>
                          <span className="bg-emerald-100 text-emerald-900 text-xs font-black px-2.5 py-0.5 rounded-full">
                            4.9 &#9733;&#9733;&#9733;&#9733;&#9733;
                          </span>
                        </h3>
                        <p className="text-xs text-stone-500 mt-0.5">
                          Based on {quickViewProduct.reviewsCount || 340} verified orders delivered across India
                        </p>
                      </div>

                      <div className="flex items-center gap-2">
                        {isEditor && (
                          <button
                            onClick={() => setAddingReviewModal({ productId: quickViewProduct.id, name: "", city: "", rating: 5, date: "Just now", text: "" })}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl shadow transition flex items-center gap-1"
                          >
                            <span>+ Add Real Review</span>
                          </button>
                        )}
                        <div className="text-xs text-stone-600 bg-stone-100 px-3.5 py-1.5 rounded-xl font-bold flex items-center gap-1.5">
                          <span className="text-emerald-600">&#10003;</span> 98% Recommend
                        </div>
                      </div>
                    </div>

                    {/* Review Cards Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {(quickViewProduct.reviews || [
                        { name: "Mrunal Joshi", city: "Thane West", rating: 5, date: "2 days ago", verified: true, text: "Ekdum authentic Alibaug style taste! Zero sand particles, clean and perfectly sun-dried. Crispiness turned out hotel style!" },
                        { name: "Sanket Patil", city: "Dadar, Mumbai", rating: 5, date: "5 days ago", verified: true, text: "Been looking for clean quality in Mumbai. CKP's Crunch quality is outstanding. Crunchy, fresh aroma, no excessive salt." },
                        { name: "Anuradha Pradhan", city: "Pune", rating: 5, date: "1 week ago", verified: true, text: "Reminded me of childhood summer vacations at my Aaji's home in Konkan. Packaged in airtight moisture-lock zip bag." }
                      ]).map((rev, rIdx) => (
                        <div key={rIdx} className="bg-stone-50 p-4 rounded-2xl border border-stone-200 space-y-2 flex flex-col justify-between">
                          <div className="space-y-2">
                            <div className="flex items-center justify-between">
                              <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-full bg-sky-900 text-amber-200 font-black text-xs flex items-center justify-center">
                                  {rev.name.split(" ").map(n => n[0]).join("")}
                                </div>
                                <div>
                                  <div className="text-xs font-bold text-stone-900 flex items-center gap-1">
                                    <span>{rev.name}</span>
                                    <span className="text-emerald-600 text-[10px]" title="Verified Buyer">&#9989;</span>
                                  </div>
                                  <div className="text-[10px] text-stone-400">&#128205; {rev.city}</div>
                                </div>
                              </div>
                              <span className="text-[10px] text-stone-400">{rev.date}</span>
                            </div>

                            <div className="flex text-amber-400 text-xs">
                              {"&#9733;".repeat(rev.rating || 5)}
                            </div>

                            <p className="text-xs text-stone-700 italic leading-relaxed">
                              "{rev.text}"
                            </p>
                          </div>

                          <div className="text-[10px] text-stone-400 pt-2 border-t flex items-center justify-between">
                            <span>Verified Order &#10003;</span>
                            {isEditor ? (
                              <button
                                onClick={() => {
                                  if (confirm("Delete this review?")) {
                                    setProducts(prev => prev.map(p => {
                                      if (p.id === quickViewProduct.id) {
                                        const updatedRevs = (p.reviews || []).filter((_, idx) => idx !== rIdx);
                                        const updated = { ...p, reviews: updatedRevs };
                                        setQuickViewProduct(updated);
                                        return updated;
                                      }
                                      return p;
                                    }));
                                  }
                                }}
                                className="text-red-600 hover:underline font-bold"
                              >
                                &#128465; Remove
                              </button>
                            ) : (
                              <span className="cursor-pointer hover:text-stone-600">&#128077; Helpful (19)</span>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Shop More Items Section */}
                  <div className="p-6 sm:p-8 bg-stone-100/60 space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="font-brand font-black text-lg text-stone-900 flex items-center gap-2">
                          <span>&#127754; Shop More Items</span>
                          <span className="text-xs font-normal text-stone-500">(Frequently Paired Together)</span>
                        </h3>
                        <p className="text-xs text-stone-500">Other customers also added these coastal favorites to their order</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      {relatedProducts.map(rel => (
                        <div
                          key={rel.id}
                          className="bg-white p-3 rounded-2xl border border-stone-200 shadow-sm hover:shadow-md transition flex flex-col justify-between group"
                        >
                          <div
                            onClick={() => openProductDetail(rel)}
                            className="cursor-pointer space-y-2"
                          >
                            <div className="relative h-28 rounded-xl overflow-hidden bg-stone-100">
                              <img
                                src={rel.image}
                                alt={rel.name}
                                className="w-full h-full object-cover group-hover:scale-105 transition"
                              />
                              <span className="absolute bottom-1 left-1 bg-black/70 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                                {rel.category}
                              </span>
                            </div>
                            <div>
                              <h4 className="text-xs font-bold text-stone-900 line-clamp-1 group-hover:text-sky-800 transition">
                                {rel.name}
                              </h4>
                              <p className="text-[10px] text-stone-500 line-clamp-1">{rel.tagline}</p>
                            </div>
                          </div>

                          <div className="pt-2 mt-2 border-t flex items-center justify-between">
                            <span className="text-xs font-black text-stone-900">&#8377;{rel.variants[0]?.price}</span>
                            <button
                              onClick={() => {
                                addToCart(rel);
                                if (window.confetti) {
                                  window.confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
                                }
                              }}
                              className="bg-sky-800 hover:bg-sky-900 text-white text-[11px] font-black px-2.5 py-1 rounded-lg shadow-sm transition"
                            >
                              + Add
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            );
          })()}

          {/* ================= EDIT PRODUCT DETAILS MODAL (FOR OWNER & STAFF) ================= */}
          {editingProductModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-amber-100 text-amber-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">Product Page Customizer</span>
                    <h3 className="font-brand font-black text-xl text-stone-900 mt-1">Edit: {editingProductModal.name}</h3>
                  </div>

        // Production Error Boundary: Guarantees website never crashes to a white screen
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(err, info) {
        console.error("Storefront ErrorBoundary caught error:", err, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#FAF7F2] flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-stone-200 space-y-4">
                <span className="text-4xl">&#128031;</span>
                <h2 className="font-brand font-black text-2xl text-stone-900">CKP's Crunch Storefront</h2>
                <p className="text-xs text-stone-600 font-medium">
                  We are updating the coastal inventory and authentic spice catalog.
                </p>
                <button
                  type="button"
                  onClick={() => { try { sessionStorage.clear(); } catch(e){} window.location.reload(); }}
                  className="w-full bg-sky-800 hover:bg-sky-900 text-white font-bold py-3 rounded-2xl text-xs shadow-md transition"
                >
                  &#8634; Refresh Storefront
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
