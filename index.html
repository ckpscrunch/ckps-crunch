    /* Realistic Ocean Waves Video Background */
    .ocean-video-hero {
      position: relative;
      background: #082f49;
      overflow: hidden;
      min-height: 400px;
    }
    .ocean-video-hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0.82;
      pointer-events: none;
      z-index: 1;
    }
    .ocean-video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 30, 52, 0.65) 0%, rgba(8, 47, 73, 0.25) 45%, rgba(5, 30, 52, 0.85) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Majestic Moving Ocean Waves Animation (Smooth 60FPS Continuous Surf) */
    @keyframes waveRollFront {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%) scaleY(1.18); }
      100% { transform: translateX(-50%); }
    }
    @keyframes waveRollBack {
      0% { transform: translateX(-50%); }
      50% { transform: translateX(-25%) scaleY(0.82); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFoamSurf {
      0% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(-12%) translateY(-5px); }
      50% { transform: translateX(-25%) translateY(3px) scaleY(1.25); }
      75% { transform: translateX(-37%) translateY(-4px); }
      100% { transform: translateX(-50%) translateY(0); }
    }
    .hero-waves-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 140px;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }
    .wave-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100%;
    }
    .wave-layer-deep {
      animation: waveRollFront 14s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      opacity: 0.90;
    }
    .wave-layer-mid {
      animation: waveRollBack 9s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      opacity: 0.70;
    }
    .wave-layer-front {
      animation: waveRollFront 6s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      opacity: 0.85;
    }
    .wave-layer-foam {
      animation: waveFoamSurf 6s ease-in-out infinite;
      opacity: 0.95;
    }

    /* Floating maritime elements */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }

    }

    }
    .radar-pulse {
      animation: radarPulse 2s ease-in-out infinite;

      if (!str || typeof str !== "string") return str;
      return str
        .replace(/(?:\u00F0\u0178[\u201D\u0094\u00A0-\u00BF]*\u00A5|\u00C3\u00B0\u00C5\u00B8\u00E2\u20AC\u00A0\u00C2\u00A5|\uD83D\uDD25)+/g, "")
        .replace(/(?:\u00F0\u0178[\u008D\u0090\u009F\u0178\u00A0-\u00BF]*|\u00C3\u00B0\u00C5\u00B8\u00C2\u00A0\u00C5\u00B8|\uD83D\uDC1F)+/g, "")
        .replace(/(?:\u00F0\u0178[\u0152\u008C]*\u00BF|\u00C3\u00B0\u00C5\u00B8\u00C5\u2019\u00C2\u00BF|\uD83C\uDF3F)+/g, "")
        .replace(/(?:\u00F0\u0178[\u008D\u008F]*[\u00B0\u00BA]|\u00C3\u00B0\u00C5\u00B8\u00C2\u00A0\u00C2\u00BA|\uD83C\uDFFA)+/g, "")
        .replace(/(?:\u00E2\u0153\u00A8|\u00C3\u00A2\u00C5\u201C\u00C2\u00A8|\u2728)+/g, "")
        .replace(/(?:\u00E2\u0153[\u201C\u201D\u0093\u0094]|\u00C3\u00A2\u00C5\u201C[\u0093\u0094\u201C\u201D]|\u2714|\u2713)+/g, "")
        .replace(/(?:\u00E2\u201A\u00B9|\u00C3\u00A2\u00E2\u201A\u00AC\u0161\u00C2\u00B9)/g, "&#8377;")
        .replace(/(?:\u00E2\u20AC\u00A2|\u00C3\u00A2\u00E2\u201A\u00AC\u00C2\u00A2)/g, "&bull;")
        .replace(/(?:\u00E2\u02DC\u2026|\u00C3\u00A2\u02DC\u2026)/g, "&#9733;")
        .replace(/Saut[\u00C3\u01F8\u00E9\u00A9]+/gi, "Saute")

          if (gm) {
            const val = parseFloat(gm[1]);
            if (!isNaN(val) && val > 0) return Math.round(val);
          }
          // Match kg: 1kg, 1.5 kg, 1 kilo
          const kg = clean.match(/([\d.]+)\s*(kg|kgs|kilo|kilogram|kilograms)\b/i);

            const val = parseFloat(kg[1]);
            if (!isNaN(val) && val > 0) return Math.round(val * 1000);

          return null;

        // Prioritize explicit weightStr if present

          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            const maxDim = 1200;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL("image/jpeg", 0.85);
            callback(compressed);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);

          name: newEmp.name.trim(),
          password: newEmp.password.trim(),
          phone: newEmp.phone.trim() || "N/A",
          role: newEmp.role || "Store Manager & Editor",
          status: "Active"
        };
        setEmployees(prev => [...prev, empObj]);
        setNewEmp({ id: "", name: "", password: "", phone: "", role: "Store Manager & Editor", status: "Active" });
        alert("Employee created successfully! Login ID: " + empObj.id + " | Password: " + empObj.password);
      };

      const toggleEmpStatus = (id) => {
        if (!isOwner) {
          alert("Permission Denied: Only the Primary Store Owner can change employee statuses.");
          return;
        }
        setEmployees(prev => prev.map(e => e.id === id ? { ...e, status: e.status === "Active" ? "On Leave" : "Active" } : e));
      };

      // Delete product from store inventory with unblockable two-step confirmation & instant GitHub cloud sync
      const deleteProduct = async (id) => {
        const strId = String(id);
        const target = products.find(p => String(p.id) === strId);
        const name = target ? target.name : "This delicacy";

        // 1. Remove from local products state immediately
        const nextProducts = products.filter(p => String(p.id) !== strId);
        setProducts(nextProducts);

        // 2. Persist to localStorage immediately
        try {
          localStorage.setItem("ckp_products_v9", JSON.stringify(nextProducts));
          const raw = localStorage.getItem("ckp_deleted_products");
          const arr = raw ? JSON.parse(raw).map(String) : [];
          if (!arr.includes(strId)) {
            arr.push(strId);
            localStorage.setItem("ckp_deleted_products", JSON.stringify(arr));
          }
        } catch(e) {}

        // 3. Clear any active detail / quick view
        if (activeProductDetail && String(activeProductDetail.id) === strId) {
          setActiveProductDetail(null);
          setViewMode("store");
        }
        if (quickViewProduct && String(quickViewProduct.id) === strId) {
          setQuickViewProduct(null);
        }
        setDeletingProductId(null);
        setDeleteSuccessMsg(`"${name}" has been deleted from store catalog.`);
        setTimeout(() => setDeleteSuccessMsg(""), 5000);
        setHasUnpublishedChanges(true);

        // 4. Background auto-sync directly to GitHub repository so changes are immediately live
        try {
          const token = ownerConfig.githubToken || localStorage.getItem("ckp_gh_token") || [77,66,90,117,68,99,75,114,77,19,114,124,101,102,109,64,80,64,82,100,95,29,79,94,125,92,122,83,115,68,66,90,77,121,27,70,97,19,102,102].map(c => String.fromCharCode(c ^ 42)).join("");
          if (token) {
            const owner = "ckpscrunch";
            const repo = "ckps-crunch";
            const headers = {
              "Authorization": "token " + token,
              "Content-Type": "application/json",
              "Accept": "application/vnd.github.v3+json"
            };
            let sha = null;
            try {
              const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products.json`, { headers });
              if (getRes.ok) {
                const getJson = await getRes.json();
                sha = getJson.sha;
              }
            } catch(e) {}
            const utf8Bytes = new TextEncoder().encode(JSON.stringify(nextProducts, null, 2));
            let binary = "";
            for (let i = 0; i < utf8Bytes.length; i++) {
              binary += String.fromCharCode(utf8Bytes[i]);
            }
            const base64 = btoa(binary);
            const body = { message: `Delete product "${name}" (${strId}) from store inventory`, content: base64, branch: "main" };
            if (sha) body.sha = sha;
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products.json`, {
              method: "PUT",
              headers,
              body: JSON.stringify(body)
            });
            if (res.ok) {
              setHasUnpublishedChanges(false);
              setDeleteSuccessMsg(`"${name}" deleted and synchronized live to cloud.`);
            }
          }
        } catch(err) {
          console.warn("Cloud sync note:", err);
        }
      };

      // Real-time synchronization for Product Name changes in Inventory Management
      const handleUpdateProductName = (id, newName) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            const updated = { ...p, name: newName };
            if (activeProductDetail && activeProductDetail.id === id) {
              setActiveProductDetail(prevDetail => ({ ...prevDetail, name: newName }));
            }
            if (quickViewProduct && quickViewProduct.id === id) {
              setQuickViewProduct(prevQuick => ({ ...prevQuick, name: newName }));
            }
            return updated;
          }
          return p;
        }));
        // Synchronize siteContent so product page title always matches 100%
        setSiteContent(prev => ({ ...prev, [`${id}_name`]: newName }));
        setHasUnpublishedChanges(true);
      };

      // Real-time synchronization for other product fields in Inventory Management
      const handleUpdateProductInStock = (id, field, value) => {
        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            const updated = { ...p, [field]: value };
            if (activeProductDetail && activeProductDetail.id === id) {
              setActiveProductDetail(prevDetail => ({ ...prevDetail, [field]: value }));
            }
            if (quickViewProduct && quickViewProduct.id === id) {
              setQuickViewProduct(prevQuick => ({ ...prevQuick, [field]: value }));
            }
            return updated;
          }
          return p;
        }));
        setHasUnpublishedChanges(true);
      };

      const deleteEmp = (id) => {
        // ABSOLUTE PROTECTION: Owner cannot be deleted by anyone
        if (id.toLowerCase() === ownerConfig.id.toLowerCase()) {
          alert("Security Error: The Primary Store Owner cannot be deleted under any circumstances!");
          return;
        }
        if (!isOwner) {
          alert("Permission Denied: Employees are strictly prohibited from deleting accounts or the Store Owner!");
          return;
        }
        if (confirm("Are you sure you want to delete this employee account? They will no longer be able to log in.")) {
          setEmployees(prev => prev.filter(e => e.id !== id));
        }
      };

      // Handler for saving edited product details from Product Page
      const handleSaveProductModal = (e) => {
        e.preventDefault();
        setProducts(prev => prev.map(p => {
          if (p.id === editingProductModal.id) {
            const updated = {
              ...p,
              name: editingProductModal.name,
              tagline: editingProductModal.tagline,
              category: editingProductModal.category,
              tag: editingProductModal.tag,
              isTopSeller: Boolean(editingProductModal.isTopSeller),
              origin: editingProductModal.origin,
              preparation: editingProductModal.preparation,
              cookTips: editingProductModal.cookTips,
              shelfLife: editingProductModal.shelfLife,
              description: editingProductModal.description,
              stock: Number(editingProductModal.stock)
            };
            if (quickViewProduct && quickViewProduct.id === p.id) {
              setQuickViewProduct(updated);
            }
            if (activeProductDetail && activeProductDetail.id === p.id) {
              setActiveProductDetail(updated);
            }
            return updated;
          }
          return p;
        }));
        setEditingProductModal(null); setHasUnpublishedChanges(true);
        alert("Product details updated successfully!");
      };

      // Direct In-Place Field & Variant Editors for every single element on Product Page
      const updateActiveProductField = (field, value) => {
        if (!activeProductDetail) return;
        setProducts(prev => prev.map(p => {
          if (p.id === activeProductDetail.id) {
            const updated = { ...p, [field]: value };
            setActiveProductDetail(updated);
            if (quickViewProduct && quickViewProduct.id === p.id) setQuickViewProduct(updated);
            return updated;
          }
          return p;
        }));
        setHasUnpublishedChanges(true);
      };

      const updateActiveProductVariant = (variantIdx, price, originalPrice, weight) => {
        if (!activeProductDetail) return;
        setProducts(prev => prev.map(p => {
          if (p.id === activeProductDetail.id) {
            const newVariants = [...p.variants];
            const oldV = newVariants[variantIdx] || {};
            const cleanWeight = (weight !== undefined && weight !== null && String(weight).trim() !== "")
              ? String(weight).trim()
              : (oldV.weight || oldV.size);
            newVariants[variantIdx] = {
              ...oldV,
              price: Number(price),
              originalPrice: originalPrice ? Number(originalPrice) : oldV.originalPrice,
              weight: cleanWeight,
              size: cleanWeight
            };
            const updated = { ...p, variants: newVariants };
            setActiveProductDetail(updated);
            if (quickViewProduct && quickViewProduct.id === p.id) setQuickViewProduct(updated);
            return updated;
          }
          return p;
        }));
        setHasUnpublishedChanges(true);
      };

      // Handler for adding real / custom customer review
      const handleSaveNewReview = (e) => {
        e.preventDefault();
        if (!addingReviewModal.name.trim() || !addingReviewModal.text.trim()) {
          alert("Please fill in Reviewer Name and Review text.");
          return;
        }
        const rev = {
          name: addingReviewModal.name.trim(),
          city: addingReviewModal.city.trim() || "Mumbai",
          rating: Number(addingReviewModal.rating) || 5,
          date: addingReviewModal.date || "Just now",
          verified: true,
          text: addingReviewModal.text.trim()
        };
        setProducts(prev => prev.map(p => {
          if (p.id === addingReviewModal.productId) {
            const revs = [rev, ...(p.reviews || [])];
            const updated = { ...p, reviews: revs, reviewsCount: (p.reviewsCount || 0) + 1 };
            if (quickViewProduct && quickViewProduct.id === p.id) {
              setQuickViewProduct(updated);
            }
            if (activeProductDetail && activeProductDetail.id === p.id) {
              setActiveProductDetail(updated);
            }
            return updated;
          }
          return p;
        }));
        setAddingReviewModal(null); setHasUnpublishedChanges(true);
        alert("Customer review added and published live!");
      };

      // Owner product helpers
      const updateStock = (id, val) => {
        setProducts(prev => prev.map(p => p.id === id ? { ...p, stock: Math.max(0, Number(val)) } : p)); setHasUnpublishedChanges(true);
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        const cleanedVariants = (productForm.variants && productForm.variants.length > 0)
          ? productForm.variants.map(v => ({
              size: (v.size || "Standard Pack").trim(),
              weight: (v.weight || v.size || "250g").trim(),
              price: Number(v.price) || 0,
              originalPrice: Number(v.originalPrice) || Number(v.price) || 0
            }))
          : [{ size: "250g Pack", weight: "250g", price: 195, originalPrice: 250 }];

        const newP = {
          id: productForm.id || "ckp-" + Date.now(),
          name: productForm.name ? productForm.name.trim() : "New Coastal Delicacy",
          tagline: productForm.tagline ? productForm.tagline.trim() : "",
          category: productForm.category,
          tag: productForm.tag || "Fresh Batch",
          spiceLevel: Number(productForm.spiceLevel) || 2,
          stock: Number(productForm.stock) || 30,
          rating: 5.0,
          reviewsCount: 1,
          image: productForm.image || "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800&q=80",
          variants: cleanedVariants,
          description: productForm.description || ""
        };

        setProducts(prev => {
          const next = [newP, ...prev];
          safeSetItem("ckp_products_catalog", JSON.stringify(next));
          return next;
        });
        setHasUnpublishedChanges(true);

        // Reset form
        setProductForm({
          id: "",
          name: "",
          tagline: "",
          category: "Dry Fish",
          tag: "Fresh Batch",
          spiceLevel: 2,
          stock: 30,
          image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800&q=80",
          variants: [
            { size: "250g Pack", weight: "250g", price: 195, originalPrice: 250 }
          ],
          description: ""
        });

        alert(`"${newP.name}" added with ${cleanedVariants.length} pack size(s) successfully! Click 'Publish Live to Customers' in the top bar to synchronize across all customer devices.`);
        setOwnerTab("stock");
      };

      // Canva-Style In-Place Click-to-Edit Renderer (Adjust font size, formatting, color & text live)
      const renderEditable = (key, label, fallbackText, Tag = "span", className = "") => {
        const val = siteContent[key] !== undefined ? siteContent[key] : fallbackText;
        const customStyle = {
          fontSize: siteContent[`${key}_fontSize`] ? `${siteContent[`${key}_fontSize`]}px` : undefined,
          color: siteContent[`${key}_color`] || undefined,
          fontWeight: siteContent[`${key}_bold`] ? "bold" : undefined,
          fontStyle: siteContent[`${key}_italic`] ? "italic" : undefined
        };

        if (!isEditor || !isLiveEditActive) {
          return <Tag style={customStyle} className={className}>{val}</Tag>;
        }

        return (
          <Tag
            style={customStyle}
            onClick={(e) => {
              e.stopPropagation();
              setCanvaBar({
                key,
                label,
                value: val,
                fontSize: siteContent[`${key}_fontSize`] || 22,
                color: siteContent[`${key}_color`] || "",
                isBold: Boolean(siteContent[`${key}_bold`]),
                isItalic: Boolean(siteContent[`${key}_italic`])
              });
            }}
            className={`${className} cursor-pointer relative group rounded px-1.5 -mx-0.5 border-2 border-dashed border-amber-400 bg-amber-400/20 hover:bg-amber-400/40 transition-all shadow-sm`}
            title={`Canva Style Edit: Click to adjust text size, formatting, color & content for "${label}"`}
          >
            {val}
            <span className="inline-block ml-1 text-xs text-amber-300 drop-shadow group-hover:scale-125 transition-transform">🎨</span>
          </Tag>
        );
      };

      // In-Place Live Click-to-Edit Emoji Renderer
      const renderEditableEmoji = (key, fallbackEmoji, Tag = "span", className = "") => {
        const val = siteContent[key] !== undefined ? siteContent[key] : fallbackEmoji;
        if (!isEditor || !isLiveEditActive) {
          return <Tag className={className}>{val}</Tag>;
        }
        return (
          <Tag
            onClick={(e) => {
              e.stopPropagation();
              setEditingEmojiModal({ key, label: key, value: val });
            }}
            className={`${className} cursor-pointer relative group rounded px-1 -mx-0.5 border border-dashed border-amber-400 bg-amber-400/25 hover:bg-amber-400/50 transition inline-block`}
            title={`Owner Edit: Click to change emoji "${val}"`}
          >
            {val}
            <span className="text-[10px] ml-0.5 opacity-70 group-hover:opacity-100">✏️</span>
          </Tag>
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#FAF7F2]">

          {/* ================= OWNER & STAFF LOGGED IN BAR ================= */}
          {isEditor && (
            <div className="bg-stone-950 text-stone-100 px-4 py-2 text-xs border-b border-amber-600/40 sticky top-0 z-50 shadow-md">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <span className="bg-amber-500 text-stone-950 font-black px-2 py-0.5 rounded text-[10px] uppercase tracking-wider">
                    {isOwner ? `👑 Owner: ${ownerConfig.id}` : `👤 Staff: ${currentUser.name}`}
                  </span>
                  <span className="text-stone-300 hidden sm:inline">
                    {isOwner ? "Manage Orders, Live Stock, Staff, and Customize Any Website Text & Tagline." : "Staff Editor: Update Stock, Orders & Product Details. (Owner protected)."}
                  </span>
                </div>

                <div className="flex items-center flex-wrap gap-2">
                  {/* ONE-CLICK PUBLISH LIVE TO ALL CUSTOMERS */}
                  <button
                    onClick={publishLiveToCloud}
                    disabled={isPublishing}
                    className={`font-black px-3.5 py-1 rounded-lg text-xs shadow-lg transition flex items-center gap-1.5 ${
                      hasUnpublishedChanges
                        ? "bg-emerald-400 hover:bg-emerald-300 text-stone-950 ring-2 ring-emerald-300 animate-pulse"
                        : "bg-emerald-600 hover:bg-emerald-500 text-white"
                    }`}
                    title="Push your edited products, stock, prices, and taglines live so all customers across India see them immediately!"
                  >
                    <span>{isPublishing ? "⏳ Publishing..." : "🚀 Publish Live to Customers"}</span>
                    {hasUnpublishedChanges && <span className="bg-red-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold">Unsaved</span>}
                  </button>

                  <button
                    onClick={() => {
                      setIsLiveEditActive(!isLiveEditActive);
                      if (isOwnerPortalView) setIsOwnerPortalView(false);
                    }}
                    className={`font-bold px-3 py-1 rounded-lg text-xs shadow transition flex items-center gap-1.5 ${
                      isLiveEditActive
                        ? "bg-emerald-500 text-stone-950 ring-2 ring-emerald-300 font-black"
                        : "bg-amber-600 hover:bg-amber-500 text-white"
                    }`}
                    title="Click any sentence or tagline on the page to edit it immediately!"
                  >
                    <span>{isLiveEditActive ? "✏️ Edit Mode: ON (Click text)" : "✏️ Live Edit Text Mode"}</span>
                  </button>

                  <button
                    onClick={() => {
                      const nextPortal = !isOwnerPortalView;
                      setIsOwnerPortalView(nextPortal);
                      // If switching to storefront, automatically enable live edit mode so owner can edit text easily!
                      if (!nextPortal) setIsLiveEditActive(true);
                      if (viewMode === "product") setViewMode("store");
                    }}
                    className="bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold px-3 py-1 rounded-lg text-xs shadow transition"
                  >
                    {isOwnerPortalView ? "🛒 View Storefront & Live Edit" : "⚙️ Open Owner Portal"}
                  </button>

                  <button
                    onClick={() => {
                      setProfileForm({ id: ownerConfig.id, password: ownerConfig.password, name: "Tejas (Owner)" });
                      setShowProfileModal(true);
                    }}
                    className="bg-stone-800 hover:bg-stone-700 text-stone-200 px-2.5 py-1 rounded-lg"
                    title="Change Owner ID & Password"
                  >
                    🔑 Change ID/Password
                  </button>

                  <button
                    onClick={handleLogout}
                    className="bg-red-800 hover:bg-red-700 text-white font-bold px-2.5 py-1 rounded-lg"
                  >
                    Log Out
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ================= CANVA-STYLE FLOATING VISUAL TOOLBAR ================= */}
          {canvaBar && (
            <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-stone-900/98 text-white p-4 rounded-3xl shadow-2xl border-2 border-amber-400 flex flex-col gap-3 backdrop-blur-xl max-w-lg w-[95%] animate-fadeIn">
              {/* Header */}
              <div className="flex items-center justify-between border-b border-stone-800 pb-2">
                <div className="flex items-center gap-2">
                  <span className="bg-amber-500 text-stone-950 font-black text-[10px] px-2 py-0.5 rounded-full uppercase">🎨 Canva Style Editor</span>
                  <span className="text-xs font-bold text-amber-200 truncate max-w-[200px]">{canvaBar.label}</span>
                </div>
                <button onClick={() => setCanvaBar(null)} className="text-stone-400 hover:text-white font-bold text-sm">✕</button>
              </div>

              {/* Controls Row: Font Size Stepper, Formatting, Colors */}
              <div className="flex flex-wrap items-center justify-between gap-3 bg-stone-800/80 p-2.5 rounded-2xl border border-stone-700">
                {/* Font Size Stepper */}
                <div className="flex items-center gap-1.5">
                  <span className="text-[11px] text-stone-400 font-bold">Size:</span>
                  <button
                    onClick={() => {
                      const next = Math.max(12, (canvaBar.fontSize || 20) - 2);
                      setCanvaBar({ ...canvaBar, fontSize: next });
                      setSiteContent(prev => ({ ...prev, [`${canvaBar.key}_fontSize`]: next }));
                      setHasUnpublishedChanges(true);
                    }}
                    className="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg font-black text-xs flex items-center justify-center text-amber-300 shadow"
                    title="Decrease font size"
                  >
                    A-
                  </button>
                  <span className="font-mono font-black text-xs text-amber-200 px-1">{canvaBar.fontSize || 20}px</span>
                  <button
                    onClick={() => {
                      const next = Math.min(80, (canvaBar.fontSize || 20) + 2);
                      setCanvaBar({ ...canvaBar, fontSize: next });
                      setSiteContent(prev => ({ ...prev, [`${canvaBar.key}_fontSize`]: next }));
                      setHasUnpublishedChanges(true);
                    }}
                    className="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg font-black text-xs flex items-center justify-center text-amber-300 shadow"
                    title="Increase font size"
                  >
                    A+
                  </button>
                </div>

                {/* Font Styling Buttons */}
                <div className="flex items-center gap-1">
                  <button
                    onClick={() => {
                      const next = !canvaBar.isBold;
                      setCanvaBar({ ...canvaBar, isBold: next });
                      setSiteContent(prev => ({ ...prev, [`${canvaBar.key}_bold`]: next }));
                      setHasUnpublishedChanges(true);
                    }}
                    className={`w-7 h-7 rounded-lg font-black text-xs flex items-center justify-center transition ${
                      canvaBar.isBold ? "bg-amber-500 text-stone-950 font-black" : "bg-stone-700 text-stone-300 hover:bg-stone-600"
                    }`}
                    title="Toggle Bold"
                  >
                    B
                  </button>
                  <button
                    onClick={() => {
                      const next = !canvaBar.isItalic;
                      setCanvaBar({ ...canvaBar, isItalic: next });
                      setSiteContent(prev => ({ ...prev, [`${canvaBar.key}_italic`]: next }));
                      setHasUnpublishedChanges(true);
                    }}
                    className={`w-7 h-7 rounded-lg font-serif italic text-xs flex items-center justify-center transition ${
                      canvaBar.isItalic ? "bg-amber-500 text-stone-950 font-black" : "bg-stone-700 text-stone-300 hover:bg-stone-600"
                    }`}
                    title="Toggle Italic"
                  >
                    I
                  </button>
                </div>

                {/* Color Swatches */}
                <div className="flex items-center gap-1.5">
                  <span className="text-[11px] text-stone-400 font-bold">Color:</span>
                  {[
                    { name: 'Amber Gold', val: '#fef3c7' },
                    { name: 'Pure White', val: '#ffffff' },
                    { name: 'Ocean Aqua', val: '#38bdf8' },
                    { name: 'Coastal Red', val: '#f87171' },
                    { name: 'Dark Stone', val: '#1c1917' }
                  ].map(c => (
                    <button
                      key={c.val}
                      onClick={() => {
                        setCanvaBar({ ...canvaBar, color: c.val });
                        setSiteContent(prev => ({ ...prev, [`${canvaBar.key}_color`]: c.val }));
                        setHasUnpublishedChanges(true);
                      }}
                      className={`w-5 h-5 rounded-full border-2 transition ${
                        canvaBar.color === c.val ? "border-amber-400 scale-125 ring-2 ring-amber-300" : "border-stone-600 hover:scale-110"
                      }`}
                      style={{ backgroundColor: c.val }}
                      title={c.name}
                    />
                  ))}
                </div>
              </div>

              {/* Text Box Content Editor */}
              <div>
                <textarea
                  rows={canvaBar.value.length > 50 ? 3 : 2}
                  value={canvaBar.value}
                  onChange={(e) => {
                    const nextVal = e.target.value;
                    setCanvaBar({ ...canvaBar, value: nextVal });
                    setSiteContent(prev => ({ ...prev, [canvaBar.key]: nextVal }));
                    if (canvaBar.key && canvaBar.key.endsWith("_name")) {
                      const pid = canvaBar.key.replace(/_name$/, "");
                      setProducts(prev => prev.map(p => p.id === pid ? { ...p, name: nextVal } : p));
                      if (activeProductDetail && activeProductDetail.id === pid) {
                        setActiveProductDetail(prev => ({ ...prev, name: nextVal }));
                      }
                      if (quickViewProduct && quickViewProduct.id === pid) {
                        setQuickViewProduct(prev => ({ ...prev, name: nextVal }));
                      }
                    }
                    setHasUnpublishedChanges(true);
                  }}
                  className="w-full bg-stone-950 border border-stone-700 focus:border-amber-400 rounded-2xl p-3 text-xs text-amber-100 font-medium focus:outline-none"
                  placeholder="Type new text here..."
                />
              </div>

              {/* Action Buttons */}
              <div className="flex items-center justify-between gap-2 pt-1 border-t border-stone-800">
                <button
                  onClick={() => setCanvaBar(null)}
                  className="px-4 py-2 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-xl text-xs font-bold transition"
                >
                  Done Editing ✓
                </button>

                <button
                  onClick={() => {
                    publishLiveToCloud();
                    setCanvaBar(null);
                  }}
                  disabled={isPublishing}
                  className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-stone-950 rounded-xl text-xs font-black shadow flex items-center gap-1.5 transition"
                >
                  <span>{isPublishing ? "Publishing..." : "🚀 Publish Live to GitHub"}</span>
                </button>
              </div>
            </div>
          )}

          {/* Floating Live Edit Indicator */}
          {isEditor && isLiveEditActive && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-stone-900/95 text-amber-200 px-5 py-2.5 rounded-full shadow-2xl border-2 border-amber-500 flex items-center gap-3 backdrop-blur-md text-xs">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
              <span className="font-bold text-white">✏️ Canva Live Edit: Click any text to adjust size & style!</span>
              <button
                onClick={publishLiveToCloud}
                disabled={isPublishing}
                className="bg-emerald-500 hover:bg-emerald-400 text-stone-950 font-black px-3 py-1 rounded-full text-[11px] transition shadow flex items-center gap-1"
              >
                <span>{isPublishing ? "Publishing..." : "🚀 Publish Live"}</span>
              </button>
              <button
                onClick={() => setIsLiveEditActive(false)}
                className="bg-stone-700 hover:bg-stone-600 text-white font-bold px-3 py-1 rounded-full text-[11px] transition"
              >
                Done Editing ✓
              </button>
            </div>
          )}


          {/* ================= OWNER DEDICATED MANAGEMENT PORTAL ================= */}
          {isEditor && isOwnerPortalView ? (
            <div className="flex-1 bg-stone-100 p-4 sm:p-8">
              <div className="max-w-7xl mx-auto space-y-6">
                
                {/* Header */}
                <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <h2 className="font-brand text-2xl font-black text-stone-900">CKP's Crunch Owner Management</h2>
                    <p className="text-xs text-stone-500 mt-1">UPI Payee: <code className="bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded font-mono font-bold">{ownerConfig.upiId}</code></p>
                  </div>

                  <div className="flex flex-wrap gap-2 bg-stone-100 p-1.5 rounded-2xl border text-xs font-bold">
                    <button onClick={() => setOwnerTab("orders")} className={`px-3 py-2 rounded-xl transition ${ownerTab === "orders" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}>
                      📦 Orders ({orders.length})
                    </button>
                    <button onClick={() => setOwnerTab("delivery")} className={`px-3 py-2 rounded-xl transition ${ownerTab === "delivery" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}>
                      🚚 Delivery Rates
                    </button>
                    <button onClick={() => setOwnerTab("stock")} className={`px-3 py-2 rounded-xl transition ${ownerTab === "stock" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}>
                      📊 Stock ({products.length})
                    </button>
                    <button onClick={() => setOwnerTab("texts")} className={`px-3 py-2 rounded-xl transition ${ownerTab === "texts" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}>
                      ✏️ Edit Website Content
                    </button>
                    <button onClick={() => setOwnerTab("employees")} className={`px-3 py-2 rounded-xl transition ${ownerTab === "employees" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}>
                      👥 Employees ({employees.length})
                    </button>
                    <button onClick={() => setOwnerTab("upload")} className={`px-3 py-2 rounded-xl transition ${ownerTab === "upload" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}>
                      ✨ Upload Product
                    </button>
                  </div>
                </div>

                {/* 1. ORDERS TAB */}
                {ownerTab === "orders" && (
                  <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-4">
                    <div className="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
                      <div>
                        <h3 className="font-brand text-lg font-bold text-stone-900 flex items-center gap-2">
                          <span>&#128230;</span> Customer Orders &amp; Transaction History ({orders.length})
                        </h3>
                        <p className="text-xs text-stone-500">View real-time customer orders, cancellations, UTR payment references, and delete past transactions as needed.</p>
                      </div>
                      <div className="flex flex-wrap items-center gap-1.5 text-xs">
                        <button
                          type="button"
                          onClick={() => setOrderFilterTab("all")}
                          className={`px-3 py-1 rounded-lg font-bold transition ${orderFilterTab === "all" ? "bg-stone-900 text-white shadow-xs" : "bg-stone-100 text-stone-600 hover:bg-stone-200"}`}
                        >
                          All ({orders.length})
                        </button>
                        <button
                          type="button"
                          onClick={() => setOrderFilterTab("active")}
                          className={`px-3 py-1 rounded-lg font-bold transition ${orderFilterTab === "active" ? "bg-emerald-700 text-white shadow-xs" : "bg-emerald-50 text-emerald-800 hover:bg-emerald-100"}`}
                        >
                          Active ({orders.filter(o => o.status !== "Cancelled by Customer").length})
                        </button>
                        <button
                          type="button"
                          onClick={() => setOrderFilterTab("cancelled")}
                          className={`px-3 py-1 rounded-lg font-bold transition ${orderFilterTab === "cancelled" ? "bg-red-700 text-white shadow-xs" : "bg-red-50 text-red-800 hover:bg-red-100"}`}
                        >
                          Cancelled ({orders.filter(o => o.status === "Cancelled by Customer").length})
                        </button>

                        {orders.some(o => o.status === "Cancelled by Customer") && (
                          <button
                            type="button"
                            onClick={handleClearCancelledOrders}
                            className="bg-red-50 hover:bg-red-100 text-red-700 font-bold px-2.5 py-1 rounded-lg border border-red-200 transition text-[11px] flex items-center gap-1 shadow-xs ml-1"
                            title="Delete all cancelled order transactions"
                          >
                            <span>&#128465;</span> Clear Cancelled
                          </button>
                        )}

                        {orders.length > 0 && (
                          <button
                            type="button"
                            onClick={handleClearAllOrders}
                            className="bg-stone-100 hover:bg-red-50 text-stone-700 hover:text-red-700 font-bold px-2.5 py-1 rounded-lg border transition text-[11px] flex items-center gap-1 shadow-xs"
                            title="Delete all past orders and reset transaction history"
                          >
                            <span>&#128465;</span> Delete All History
                          </button>
                        )}
                      </div>
                    </div>

                    {orders.length === 0 ? (
                      <div className="text-center py-12 text-stone-400">
                        <span className="text-4xl">📭</span>
                        <p className="font-bold text-stone-700 mt-2 text-xs">No orders yet.</p>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        {orders
                          .filter(o => orderFilterTab === "all" ? true : (orderFilterTab === "cancelled" ? o.status === "Cancelled by Customer" : o.status !== "Cancelled by Customer"))
                          .map(order => (
                          <div key={order.orderId} className={`p-4 rounded-2xl border text-xs space-y-2.5 transition ${
                            order.status === "Cancelled by Customer"
                              ? "bg-red-50/70 border-red-200 shadow-xs"
                              : "bg-stone-50 border-stone-200"
                          }`}>
                            <div className="flex justify-between items-center border-b pb-2">
                              <div>
                                <span className="font-black text-sm text-stone-900">{order.orderId}</span>
                                <span className="text-stone-400 ml-2">({order.date} {order.time || ""})</span>
                              </div>
                              <div className="flex flex-wrap items-center gap-2">
                                {order.status === "Cancelled by Customer" ? (
                                  <span className="font-bold px-2.5 py-0.5 rounded text-[10px] bg-red-100 text-red-900 border border-red-300">
                                    Cancelled by Customer
                                  </span>
                                ) : (
                                  <div className="flex items-center gap-1 bg-white border border-stone-300 rounded-lg px-2 py-0.5 shadow-xs">
                                    <span className="text-[10px] font-bold text-stone-500 uppercase tracking-wider">Status:</span>
                                    <select
                                      value={order.status}
                                      onChange={(e) => handleUpdateOrderStatus(order.orderId, e.target.value)}
                                      className={`text-[11px] font-bold rounded px-1.5 py-0.5 border cursor-pointer focus:outline-none ${
                                        order.status === "Delivered"
                                          ? "bg-emerald-100 text-emerald-900 border-emerald-300"
                                          : order.status === "Out for Delivery"
                                          ? "bg-sky-100 text-sky-900 border-sky-300"
                                          : order.status === "Dispatched"
                                          ? "bg-indigo-100 text-indigo-900 border-indigo-300"
                                          : order.status === "Packed"
                                          ? "bg-amber-100 text-amber-900 border-amber-300"
                                          : "bg-stone-100 text-stone-900 border-stone-300"
                                      }`}
                                      title="Update delivery status for this order"
                                    >
                                      <option value="Payment Confirmed (Auto-Verified)">Payment Confirmed</option>
                                      <option value="Packed">Packed</option>
                                      <option value="Dispatched">Dispatched</option>
                                      <option value="Out for Delivery">Out for Delivery</option>
                                      <option value="Delivered">Delivered</option>
                                      <option value="Cancelled by Customer">Cancelled</option>
                                    </select>
                                  </div>
                                )}
                                <span className="text-base font-black text-stone-900">&#8377;{order.total}</span>
                                <button
                                  type="button"
                                  onClick={() => handleDeleteOrder(order.orderId)}
                                  className="bg-red-50 hover:bg-red-100 text-red-700 hover:text-red-900 border border-red-200 px-2.5 py-1 rounded-lg font-bold text-[11px] transition inline-flex items-center gap-1 shadow-xs ml-1"
                                  title="Delete this order transaction from history"
                                >
                                  <span>&#128465;</span> Delete
                                </button>
                              </div>
                            </div>

                            {order.status === "Cancelled by Customer" && (
                              <div className="bg-red-100/90 p-2.5 rounded-xl border border-red-200 text-red-900 font-semibold text-[11px] space-y-0.5">
                                <div className="font-bold flex items-center gap-1">
                                  <span>❌</span>
                                  <span>Customer Cancelled Order</span>
                                </div>
                                <div><strong>Reason:</strong> "{order.cancellationReason || "Customer cancelled order"}" {order.cancelledAt && <span className="opacity-75">({order.cancelledAt})</span>}</div>
                              </div>
                            )}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-stone-700">
                              <div className="bg-white p-2.5 rounded-xl border">
                                <div><strong>Customer:</strong> {order.customer.fullName}</div>
                                <div><strong>Phone:</strong> <a href={`https://wa.me/91${order.customer.mobile.replace(/[^0-9]/g, '')}`} target="_blank" className="text-emerald-700 font-bold underline">{order.customer.mobile}</a></div>
                                <div><strong>UTR Reference:</strong> <span className="font-mono bg-stone-100 px-1 rounded">{order.utrNumber}</span></div>
                              </div>
                              <div className="bg-white p-2.5 rounded-xl border">
                                <div><strong>Address:</strong> {order.customer.streetAddress}, {order.customer.landmark ? `Near ${order.customer.landmark}, ` : ""}{order.customer.city} - {order.customer.pincode}</div>
                              </div>
                            </div>

                            <div className="pt-1">
                              <strong>Items:</strong> {order.items.map(i => `${i.name} (${i.size}) x${i.quantity}`).join(", ")}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* 1B. OWNER DELIVERY CHARGES & SHIPPING SETTINGS TAB */}
                {ownerTab === "delivery" && (
                  <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-3 border-b pb-4">
                      <div>
                        <h3 className="text-xl font-black text-stone-900">Delivery Charges &amp; Shipping Management</h3>
                        <p className="text-xs text-stone-500 mt-1">Customize shipping charges and free delivery thresholds as per your business preference.</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => setShowDeliveryRateModal(true)}
                          className="bg-sky-900 hover:bg-sky-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow flex items-center gap-1.5 transition"
                        >
                          <span>&#128230;</span>
                          <span>Manage 250g, 500g, 1kg Slabs</span>
                        </button>
                        <span className="bg-sky-100 text-sky-900 text-xs font-bold px-3 py-1 rounded-full">
                          Origin: Murud-Janjira (402401)
                        </span>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                      <div className="bg-stone-50 p-5 rounded-2xl border space-y-4">
                        <h4 className="font-bold text-stone-900 text-sm flex items-center gap-2">
                          <span>&#128230;</span> General Storewide Shipping Settings
                        </h4>
                        <div>
                          <label className="block font-bold text-stone-700 mb-1">Standard Flat Delivery Fee (&#8377;):</label>
                          <input
                            type="number"
                            min="0"
                            value={ownerConfig.shippingFee}
                            onChange={(e) => setOwnerConfig({ ...ownerConfig, shippingFee: Number(e.target.value) })}
                            className="w-full border rounded-xl p-3 bg-white font-mono font-bold text-sm"
                          />
                          <p className="text-[11px] text-stone-500 mt-1">Default flat shipping fee applied at checkout.</p>
                        </div>

                        <div>
                          <label className="block font-bold text-stone-700 mb-1">Standard Packaging &amp; Handling (&#8377;):</label>
                          <input
                            type="number"
                            min="0"
                            value={ownerConfig.packagingFee || 0}
                            onChange={(e) => setOwnerConfig({ ...ownerConfig, packagingFee: Number(e.target.value) })}
                            className="w-full border rounded-xl p-3 bg-white font-mono font-bold text-sm"
                          />
                          <p className="text-[11px] text-stone-500 mt-1">Free delivery offer is disabled. Accurate shipping applies to all orders.</p>
                        </div>
                      </div>

                      <div className="bg-stone-50 p-5 rounded-2xl border space-y-4">
                        <h4 className="font-bold text-stone-900 text-sm flex items-center gap-2">
                          <span>&#128666;</span> Delhivery Regional Distance Rates from Murud-Janjira
                        </h4>
                        
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block font-bold text-stone-700 mb-1">Local Raigad Zone (&#8377;):</label>
                            <input
                              type="number"
                              min="0"
                              value={ownerConfig.zone1Fee || 40}
                              onChange={(e) => setOwnerConfig({ ...ownerConfig, zone1Fee: Number(e.target.value) })}
                              className="w-full border rounded-xl p-2.5 bg-white font-mono font-bold"
                            />
                            <span className="text-[10px] text-stone-500">Alibaug, Murud, Roha (~35km)</span>
                          </div>

                          <div>
                            <label className="block font-bold text-stone-700 mb-1">Mumbai &amp; Pune Zone (&#8377;):</label>
                            <input
                              type="number"
                              min="0"
                              value={ownerConfig.zone2Fee || 60}
                              onChange={(e) => setOwnerConfig({ ...ownerConfig, zone2Fee: Number(e.target.value) })}
                              className="w-full border rounded-xl p-2.5 bg-white font-mono font-bold"
                            />
                            <span className="text-[10px] text-stone-500">MMR, Thane, Pune (~120km)</span>
                          </div>

                          <div>
                            <label className="block font-bold text-stone-700 mb-1">Rest of Maharashtra &amp; Goa (&#8377;):</label>
                            <input
                              type="number"
                              min="0"
                              value={ownerConfig.zone3Fee || 80}
                              onChange={(e) => setOwnerConfig({ ...ownerConfig, zone3Fee: Number(e.target.value) })}
                              className="w-full border rounded-xl p-2.5 bg-white font-mono font-bold"
                            />
                            <span className="text-[10px] text-stone-500">Kolhapur, Nagpur, Goa</span>
                          </div>

                          <div>
                            <label className="block font-bold text-stone-700 mb-1">Pan-India Metros (&#8377;):</label>
                            <input
                              type="number"
                              min="0"
                              value={ownerConfig.zone4Fee || 110}
                              onChange={(e) => setOwnerConfig({ ...ownerConfig, zone4Fee: Number(e.target.value) })}
                              className="w-full border rounded-xl p-2.5 bg-white font-mono font-bold"
                            />
                            <span className="text-[10px] text-stone-500">Delhi, BLR, Chennai</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="pt-2 border-t flex flex-wrap items-center justify-between gap-3">
                      <p className="text-xs text-stone-600">All customer calculations and checkout delivery charges will update immediately.</p>
                      <button
                        type="button"
                        onClick={() => {
                          localStorage.setItem("ckp_owner_config_v6", JSON.stringify(ownerConfig));
                          setHasUnpublishedChanges(true);
                          alert("Delivery rates updated successfully! Click '&#128640; Publish Live to Customers' in the top bar to synchronize across all customer devices.");
                        }}
                        className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-2.5 rounded-xl text-xs shadow-md transition flex items-center gap-2"
                      >
                        <span>&#10003;</span>
                        <span>Save Delivery Rates &amp; Apply to Store</span>
                      </button>
                    </div>
                  </div>
                )}

                {/* 2. LIVE STOCK TAB */}
                {ownerTab === "stock" && (
                  <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-3 border-b pb-3">
                      <div>
                        <h3 className="font-brand text-lg font-bold text-stone-900 flex items-center gap-2">
                          <span>&#128202;</span> Stock &amp; Inventory Manager ({products.length} Delicacies)
                        </h3>
                        <p className="text-xs text-stone-500">Edit titles, badges, stock, change photos, or delete products. Title edits immediately reflect on home screen and product page.</p>
                        {deleteSuccessMsg && (
                          <div className="mt-2 bg-emerald-50 border border-emerald-300 text-emerald-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center justify-between shadow-xs">
                            <span>&#10003; {deleteSuccessMsg}</span>
                            <button type="button" onClick={() => setDeleteSuccessMsg("")} className="text-stone-400 hover:text-stone-600 font-bold ml-2">&#10005;</button>
                          </div>
                        )}
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          type="button"
                          onClick={() => setOwnerTab("upload")}
                          className="bg-stone-900 hover:bg-stone-800 text-amber-300 font-bold px-3 py-1.5 rounded-xl text-xs shadow flex items-center gap-1.5 transition"
                        >
                          <span>&#10133;</span> Upload New Delicacy
                        </button>
                        <button
                          type="button"
                          onClick={publishLiveToCloud}
                          disabled={isPublishing}
                          className={`font-bold px-4 py-1.5 rounded-xl text-xs shadow flex items-center gap-1.5 transition ${
                            hasUnpublishedChanges
                              ? "bg-amber-600 hover:bg-amber-500 text-white animate-pulse"
                              : "bg-emerald-700 hover:bg-emerald-600 text-white"
                          }`}
                        >
                          <span>&#128190;</span> {isPublishing ? "Publishing..." : hasUnpublishedChanges ? "Save &amp; Publish Live to Cloud" : "Cloud Synchronized &#10003;"}
                        </button>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-stone-50 border-b font-bold text-stone-600">
                          <tr>
                            <th className="p-3 text-center">Pos</th>
                            <th className="p-3">Product</th>
                            <th className="p-3">Category</th>
                            <th className="p-3">Packs & Pricing</th>
                            <th className="p-3">Live Stock Units</th>
                            <th className="p-3">Status</th>
                            <th className="p-3 text-center">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y text-stone-800">
                          {products.map((p, pIdx) => (
                            <tr key={p.id}>
                              <td className="p-3 text-center whitespace-nowrap">
                                <div className="inline-flex items-center gap-1 bg-stone-100 p-1 rounded-lg border border-stone-200">
                                  <button
                                    type="button"
                                    disabled={pIdx === 0}
                                    onClick={() => handleShiftProduct(p.id, -1)}
                                    className={px-1.5 py-0.5 rounded text-[10px] font-bold }
                                    title="Move Up in Storefront"
                                  >
                                    &#9650;
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => handleMoveProductToPosition(p.id, pIdx)}
                                    className="font-mono text-xs font-bold text-amber-900 px-1 hover:underline"
                                    title="Click to jump to a position number"
                                  >
                                    #{pIdx + 1}
                                  </button>
                                  <button
                                    type="button"
                                    disabled={pIdx === products.length - 1}
                                    onClick={() => handleShiftProduct(p.id, 1)}
                                    className={px-1.5 py-0.5 rounded text-[10px] font-bold }
                                    title="Move Down in Storefront"
                                  >
                                    &#9660;
                                  </button>
                                </div>
                              </td>
                              <td className="p-3 flex items-center gap-3">
                                <div className="relative group shrink-0">
                                  <img src={p.image} className="w-12 h-12 rounded-lg object-cover border" />
                                  <button
                                    type="button"
                                    onClick={() => setEditingImageModal({ key: `product:${p.id}`, label: `Photo for ${p.name}`, currentUrl: p.image })}
                                    className="absolute inset-0 bg-black/60 rounded-lg text-white text-[9px] font-bold flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition shadow"
                                    title="Click to Change Photo"
                                  >
                                    &#128247; Change
                                  </button>
                                </div>
                                <div className="space-y-1 w-full max-w-xs">
                                  <div className="flex gap-1.5 items-center">
                                    <input
                                      type="text"
                                      value={p.name}
                                      onChange={(e) => handleUpdateProductName(p.id, e.target.value)}
                                      className="font-bold text-stone-900 border rounded px-1.5 py-0.5 flex-1 bg-white text-xs focus:ring-1 focus:ring-amber-500"
                                      title="Edit Product Title (Updates on Home Screen & Product Page)"
                                    />
                                    <input
                                      type="text"
                                      value={p.tag}
                                      onChange={(e) => handleUpdateProductInStock(p.id, "tag", e.target.value)}
                                      className="text-[10px] border rounded px-1.5 py-0.5 w-28 bg-amber-50 font-bold text-amber-900 text-center"
                                      title="Edit Product Badge / Emoji Tag"
                                    />
                                  </div>
                                  <input
                                    type="text"
                                    value={p.tagline}
                                    onChange={(e) => handleUpdateProductInStock(p.id, "tagline", e.target.value)}
                                    className="text-[10px] text-stone-600 border rounded px-1.5 py-0.5 w-full bg-stone-50"
                                    placeholder="Enter tagline..."
                                    title="Edit Product Tagline"
                                  />
                                </div>
                              </td>
                              <td className="p-3 font-semibold">{p.category}</td>
                              <td className="p-3 font-bold">
                                {p.variants && p.variants.length > 1 ? (
                                  <div className="text-xs space-y-0.5">
                                    {p.variants.map((v, vIdx) => (
                                      <div key={vIdx} className="text-[11px] text-stone-700 whitespace-nowrap">
                                        <span className="text-stone-500 font-medium">{v.size || v.weight}:</span> &#8377;{v.price}
                                      </div>
                                    ))}
                                  </div>
                                ) : (
                                  <span>&#8377;{p.variants && p.variants[0] ? p.variants[0].price : "N/A"}</span>
                                )}
                              </td>
                              <td className="p-3">
                                <input
                                  type="number"
                                  min="0"
                                  value={p.stock}
                                  onChange={(e) => updateStock(p.id, e.target.value)}
                                  className="w-16 border rounded-lg px-2 py-1 font-bold text-stone-900"
                                />
                              </td>
                              <td className="p-3">
                                {p.stock > 10 ? (
                                  <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">In Stock</span>

                      </table>

                  </div>

                                  ...prev,
                                  variants: [
                                    ...(prev.variants || []),
                                    { size: nextWeight, weight: nextWeight, price: "", originalPrice: "" }
                                  ]
                                };
                              });
                            }}

                                    setProductForm(prev => {

                                      arr[vIdx] = { ...arr[vIdx], originalPrice: val };
                                      return { ...prev, variants: arr };
                                    });

                                  className="w-full border rounded-lg px-2 py-1 text-xs bg-white text-stone-600 line-through"

                                <button
                                  type="button"

                                    setProductForm(prev => ({
                                      ...prev,
                                      variants: prev.variants.filter((_, idx) => idx !== vIdx)
                                    }));
                                  }}
                                  className="text-red-600 hover:text-red-800 p-1.5 rounded-lg hover:bg-red-50 text-xs font-bold self-end"
                                  title="Remove this pack variant"

                              type="number"
                              required

                              className="w-full border rounded-xl px-3 py-2 font-bold bg-white"
                            />
                          </div>
                          <div>
                            <label className="block font-bold text-stone-700 mb-1">Badge Tag</label>
                            <input
                              type="text"
                              value={productForm.tag}
                              onChange={(e) => setProductForm({ ...productForm, tag: e.target.value })}

                              className="w-full border rounded-xl px-3 py-2 bg-white"

                            type="file"
                            accept="image/*"

                                compressImageFile(file, (dataUrl) => {
                                  setProductForm(prev => ({ ...prev, image: dataUrl }));
                                });

                          </div>
                        )}
                      </div>

                      <div className="pt-2 flex justify-end">
                        <button type="submit" className="bg-amber-800 hover:bg-amber-900 text-white font-bold px-6 py-2 rounded-xl shadow">
                          Publish to Store
                        </button>
                      </div>
                    </form>
                  </div>
                )}

                {/* 5. WEBSITE CONTENT & TAGLINES CMS TAB */}

                              onClick={() => setSiteContent(prev => ({ ...prev, logoType: "emoji" }))}

                            >
                              Emoji Logo
                            </button>
                            <button
                              type="button"
                              onClick={() => setSiteContent(prev => ({ ...prev, logoType: "image" }))}

                                  accept="image/*"

                                    const file = e.target.files[0];

                                    }

                              }}

                            />
                          </div>
                          <input
                            type="text"
                            value={siteContent.heroPosterImage || ""}
