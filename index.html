    html { scroll-behavior: smooth; }

    /* Realistic Ocean Waves Video Background */
    .ocean-video-hero {
      position: relative;
      background: #082f49;
      overflow: hidden;
      min-height: 400px;
    }
    .ocean-video-hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0.82;
      pointer-events: none;
      z-index: 1;
    }
    .ocean-video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 30, 52, 0.65) 0%, rgba(8, 47, 73, 0.25) 45%, rgba(5, 30, 52, 0.85) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Majestic Moving Ocean Waves Animation (Smooth 60FPS Continuous Surf) */
    @keyframes waveRollFront {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%) scaleY(1.18); }
      100% { transform: translateX(-50%); }
    }
    @keyframes waveRollBack {
      0% { transform: translateX(-50%); }
      50% { transform: translateX(-25%) scaleY(0.82); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFoamSurf {
      0% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(-12%) translateY(-5px); }
      50% { transform: translateX(-25%) translateY(3px) scaleY(1.25); }
      75% { transform: translateX(-37%) translateY(-4px); }
      100% { transform: translateX(-50%) translateY(0); }
    }
    .hero-waves-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 140px;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }
    .wave-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100%;
    }
    .wave-layer-deep {
      animation: waveRollFront 14s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      opacity: 0.90;
    }
    .wave-layer-mid {
      animation: waveRollBack 9s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      opacity: 0.70;
    }
    .wave-layer-front {
      animation: waveRollFront 6s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      opacity: 0.85;
    }
    .wave-layer-foam {
      animation: waveFoamSurf 6s ease-in-out infinite;
      opacity: 0.95;
    }

    /* Floating maritime elements */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .float-item {
      animation: floatSlow 5s ease-in-out infinite;
    }

    /* Pulse Radar Animation for Auto-fetching payment */
    @keyframes radarPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .radar-pulse {
      animation: radarPulse 2s ease-in-out infinite;
    }
  </style>

      const cartSubtotal = useMemo(() => cart.reduce((s, i) => s + i.price * i.quantity, 0), [cart]);

      const shippingCharge = cartSubtotal > 0 ? (isFreeDelivery ? 0 : ownerConfig.shippingFee) : 0;
      const cartTotal = cartSubtotal + shippingCharge;
      const totalItemsCount = cart.reduce((c, i) => c + i.quantity, 0);

      // Cart helpers
      const addToCart = (product, variantIdx = null) => {
        if (product.stock <= 0) return;
        const vIdx = variantIdx !== null ? variantIdx : (selectedVariants[product.id] || 0);
        const variant = product.variants[vIdx] || product.variants[0];
        const cartItemId = `${product.id}-${variant.size}`;

        setCart(prev => {
          const existing = prev.find(i => i.id === cartItemId);
          if (existing) {
            return prev.map(i => i.id === cartItemId ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, {
            id: cartItemId,
            productId: product.id,
            name: product.name,
            category: product.category,
            size: variant.size,
            price: variant.price,
            image: product.image,
            quantity: 1
          }];
        });
        setIsCartOpen(true);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const n = item.quantity + delta;
            return n > 0 ? { ...item, quantity: n } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeCartItem = (id) => setCart(prev => prev.filter(i => i.id !== id));

      // Same Unified Login Portal
      const handleUnifiedLogin = (e) => {
        e.preventDefault();
        const id = loginId.trim();
        const pass = loginPass.trim();

        // 1. Owner Login Check
        if (id === ownerConfig.id && pass === ownerConfig.password) {
          setCurrentUser({ role: "owner", id: ownerConfig.id, name: "Tejas (Owner)" });
          setIsOwnerPortalView(true);
          setShowLoginModal(false);
          setLoginError("");
          setLoginId(""); setLoginPass("");
          return;
        }

        // 2. Customer Auth
        if (isRegisterMode) {
          if (!loginName) {
            setLoginError("Please enter your Full Name.");
            return;
          }
          const newUser = { name: loginName, mobile: id, password: pass };
          setRegisteredUsers(prev => ({ ...prev, [id]: newUser }));
          setCurrentUser({ role: "customer", name: loginName, mobile: id });
          setShowLoginModal(false);
          setLoginError("");
          setLoginId(""); setLoginPass(""); setLoginName("");
        } else {
          const user = registeredUsers[id];
          if (user && user.password === pass) {
            setCurrentUser({ role: "customer", name: user.name, mobile: user.mobile });
            setShowLoginModal(false);
            setLoginError("");
            setLoginId(""); setLoginPass("");
          } else if (!user) {
            // Auto register on first attempt
            const autoName = loginName || "Customer " + id.slice(-4);
            const newUser = { name: autoName, mobile: id, password: pass };
            setRegisteredUsers(prev => ({ ...prev, [id]: newUser }));
            setCurrentUser({ role: "customer", name: autoName, mobile: id });
            setShowLoginModal(false);
            setLoginError("");
            setLoginId(""); setLoginPass("");
          } else {
            setLoginError("Incorrect password. Please verify.");
          }
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIsOwnerPortalView(false);
      };

      // Profile / Password Change Handler (For both Owner and Customer)
      const handleSaveProfile = (e) => {
        e.preventDefault();
        if (currentUser.role === "owner") {
          setOwnerConfig(prev => ({
            ...prev,
            id: profileForm.id || prev.id,
            password: profileForm.password || prev.password
          }));
          setCurrentUser(prev => ({ ...prev, id: profileForm.id || prev.id }));
          alert("Owner ID and Password updated successfully!");
        } else {
          // Update customer
          const mobile = currentUser.mobile;
          setRegisteredUsers(prev => ({
            ...prev,
            [mobile]: {
              ...prev[mobile],
              name: profileForm.name || prev[mobile]?.name,
              password: profileForm.password || prev[mobile]?.password
            }

      // Proceed from Cart to Customer Address Form
      const startCheckout = () => {

            ...prev,
            fullName: currentUser.name,

      // Submit Address Details -> Launch Auto Payment Gateway with QR Code

        e.preventDefault();
        if (!checkoutForm.fullName || !checkoutForm.mobile || !checkoutForm.streetAddress || !checkoutForm.pincode) {

        const orderId = "CKP-" + Math.floor(100000 + Math.random() * 900000);
        const orderInfo = {
          orderId,
          date: new Date().toLocaleDateString("en-IN", { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          customer: { ...checkoutForm },

          subtotal: cartSubtotal,
          shipping: shippingCharge,
          total: cartTotal,
          paymentMethod: "UPI Instant Auto-Pay",
          status: "Awaiting UPI Payment"

        setPendingOrder(orderInfo);

        setShowAutoPaymentGatewayModal(true);
        setPaymentStep("awaiting");
        setPaymentTimer(300); // 5 min countdown

      // Payment Timer & Simulated Webhook / Auto-Fetch
      useEffect(() => {
        let interval = null;
        if (showAutoPaymentGatewayModal && paymentStep === "awaiting" && paymentTimer > 0) {
          interval = setInterval(() => {
            setPaymentTimer(t => t - 1);
          }, 1000);
        }
        return () => clearInterval(interval);

        setPaymentStep("detecting");

          setPaymentStep("confirmed");
          
          // Complete the order
          const finalOrder = {
            ...pendingOrder,
            status: "Payment Confirmed ✅ (Auto-Verified)",
            utrNumber: "UPI-" + Math.floor(100000000000 + Math.random() * 900000000000)
          };

          // Deduct stock
          setProducts(prev => {
            return prev.map(prod => {
              const matches = finalOrder.items.filter(i => i.productId === prod.id);
              if (matches.length > 0) {
                const qty = matches.reduce((sum, item) => sum + item.quantity, 0);
                return { ...prod, stock: Math.max(0, prod.stock - qty) };
              }
              return prod;
            });
          });

          // Save to Master Orders list
          setOrders(prev => [finalOrder, ...prev]);

          if (typeof confetti === "function") {

            setShowAutoPaymentGatewayModal(false);

        if (!pendingOrder) return "";
        const pa = ownerConfig.upiId;

        const am = pendingOrder.total;
        const tn = encodeURIComponent(`CKPs Crunch Order ${pendingOrder.orderId}`);

                    autoFocus
                  />
                  <div className="text-[10px] text-stone-400 mt-1">Changes are saved live across the entire website and saved permanently in your browser.</div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setEditingTextModal(null)}
                    className="flex-1 py-2.5 border rounded-xl font-bold text-xs text-stone-600 hover:bg-stone-50"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setSiteContent(prev => ({ ...prev, [editingTextModal.key]: editingTextModal.value }));
                      setEditingTextModal(null);
                    }}
                    className="flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-xs shadow"
                  >
                    Save Line & Update Live ✓
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ================= PRODUCT QUICK VIEW MODAL ================= */}
          {quickViewProduct && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-stone-200">
                <div className="relative h-64 bg-stone-100">
                  <img src={quickViewProduct.image} alt={quickViewProduct.name} className="w-full h-full object-cover" />
                  <button onClick={() => setQuickViewProduct(null)} className="absolute top-4 right-4 bg-black/60 hover:bg-black text-white w-9 h-9 rounded-full font-bold flex items-center justify-center">✕</button>
                  <div className="absolute bottom-3 left-4">
                    <span className="bg-stone-900/90 text-amber-200 font-bold text-xs px-3 py-1 rounded-full">{quickViewProduct.tag}</span>
                  </div>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <span className="text-xs font-bold text-sky-800 uppercase tracking-wider">{quickViewProduct.category}</span>
                    <h3 className="font-brand font-black text-2xl text-stone-900 mt-1">{quickViewProduct.name}</h3>
                    <p className="text-xs text-stone-500 italic mt-0.5 font-medium">"{quickViewProduct.tagline}"</p>
                  </div>
                  <p className="text-xs text-stone-700 leading-relaxed bg-stone-50 p-3.5 rounded-2xl border">{quickViewProduct.description}</p>
                  
                  <div className="flex items-center justify-between pt-2 border-t">
                    <div>
                      <div className="text-2xl font-black text-stone-900">₹{quickViewProduct.variants[0]?.price}</div>
                      <div className="text-xs text-emerald-700 font-semibold">Available Units: {quickViewProduct.stock}</div>
                    </div>
                    <button
                      onClick={() => { addToCart(quickViewProduct); setQuickViewProduct(null); }}
                      disabled={quickViewProduct.stock <= 0}
                      className="bg-sky-800 hover:bg-sky-900 disabled:bg-stone-300 text-white font-black px-6 py-3 rounded-2xl text-xs shadow"
                    >
                      {quickViewProduct.stock > 0 ? "+ Add to Cart" : "Sold Out"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= OWNER IMAGE CUSTOMIZER MODAL (UPLOAD FROM PC OR URL) ================= */}
          {editingImageModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-sky-100 text-sky-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">Image & Photo Customizer</span>
                    <h3 className="font-brand font-black text-lg text-stone-900 mt-1">{editingImageModal.label}</h3>
                  </div>
                  <button onClick={() => setEditingImageModal(null)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                {/* Photo Preview */}
                <div className="relative h-44 rounded-2xl overflow-hidden bg-stone-100 border">
                  <img
                    src={editingImageModal.currentUrl}
                    alt="Preview"
                    className="w-full h-full object-cover"
                    onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800&q=80"; }}
                  />
                  <div className="absolute bottom-2 left-2 bg-black/70 text-white text-[10px] font-semibold px-2 py-0.5 rounded">
                    Current Image Preview
                  </div>
                </div>

                {/* Option 1: Choose from Computer */}
                <div className="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 space-y-1.5">
                  <label className="block text-xs font-black text-amber-950 flex items-center gap-1.5">
                    <span>📁</span> Option A: Upload Photo from Your Device / Computer
                  </label>
                  <input
                    type="file"
                    accept="image/*"
                    onChange={(e) => {
                      const file = e.target.files[0];
                      if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                          setEditingImageModal(prev => ({ ...prev, currentUrl: ev.target.result }));
                        };
                        reader.readAsDataURL(file);
                      }
                    }}
                    className="w-full text-xs text-stone-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer"
                  />
                  <p className="text-[10px] text-amber-800">Select any image (PNG, JPG, WebP) from your computer. It updates the website instantly.</p>
                </div>

                {/* Option 2: Paste Web URL */}
                <div className="space-y-1">
                  <label className="block text-xs font-bold text-stone-700">
                    🔗 Option B: Paste Image Web URL
                  </label>
                  <input
                    type="text"
                    value={editingImageModal.currentUrl}
                    onChange={(e) => setEditingImageModal({ ...editingImageModal, currentUrl: e.target.value })}
                    placeholder="https://images.unsplash.com/..."
                    className="w-full border rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-sky-700"
                  />
                </div>

                <div className="flex gap-2 pt-2 border-t">
                  <button
                    onClick={() => setEditingImageModal(null)}
                    className="flex-1 py-2.5 border rounded-xl font-bold text-xs text-stone-600 hover:bg-stone-50"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      const url = editingImageModal.currentUrl;
                      if (editingImageModal.key.startsWith("product:")) {
                        const pid = editingImageModal.key.replace("product:", "");
                        setProducts(prev => prev.map(p => p.id === pid ? { ...p, image: url } : p));
                      } else {
                        setSiteContent(prev => ({ ...prev, [editingImageModal.key]: url }));
                      }
                      setEditingImageModal(null);
                    }}
                    className="flex-1 py-2.5 bg-sky-800 hover:bg-sky-900 text-white rounded-xl font-bold text-xs shadow"
                  >
                    Save & Apply Photo ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= OWNER LOGO CUSTOMIZER MODAL ================= */}
          {editingLogoModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-amber-100 text-amber-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">Store Logo & Brand Customizer</span>
                    <h3 className="font-brand font-black text-lg text-stone-900 mt-1">Change Store Logo</h3>
                  </div>
                  <button onClick={() => setEditingLogoModal(false)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                {/* Choice: Emoji vs Custom Image */}
                <div className="flex gap-2 bg-stone-100 p-1.5 rounded-2xl text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => setSiteContent(prev => ({ ...prev, logoType: "emoji" }))}
                    className={`flex-1 py-2 rounded-xl transition ${siteContent.logoType !== "image" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}
                  >
                    Emoji Icon Logo
                  </button>
                  <button
                    type="button"
                    onClick={() => setSiteContent(prev => ({ ...prev, logoType: "image" }))}
                    className={`flex-1 py-2 rounded-xl transition ${siteContent.logoType === "image" ? "bg-stone-900 text-white shadow" : "text-stone-600"}`}
                  >
                    Custom Photo / Image Logo
                  </button>
                </div>

                {siteContent.logoType === "image" ? (
                  <div className="space-y-3 text-xs">
                    <div className="flex items-center gap-3 bg-stone-50 p-3 rounded-2xl border">
                      <div className="w-16 h-16 rounded-2xl bg-stone-200 overflow-hidden border shrink-0">
                        {siteContent.logoImageUrl ? (
                          <img src={siteContent.logoImageUrl} alt="Logo Preview" className="w-full h-full object-cover" />
                        ) : (
                          <div className="w-full h-full flex items-center justify-center text-stone-400 text-[10px] text-center p-1 font-bold">No Image</div>
                        )}
                      </div>
                      <div className="flex-1">
                        <label className="block font-bold text-stone-800 mb-1">Upload Logo from Computer</label>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const reader = new FileReader();
                              reader.onload = (ev) => {
                                setSiteContent(prev => ({ ...prev, logoImageUrl: ev.target.result }));
                              };
                              reader.readAsDataURL(file);
                            }
                          }}
                          className="w-full text-xs text-stone-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-stone-900 file:text-white cursor-pointer"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-stone-700 mb-1">Or Paste Logo Image URL</label>
                      <input
                        type="text"
                        value={siteContent.logoImageUrl || ""}
                        onChange={(e) => setSiteContent({ ...siteContent, logoImageUrl: e.target.value })}
                        placeholder="https://..."
                        className="w-full border rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    <div className="text-center py-3 bg-stone-50 rounded-2xl border">
                      <span className="text-5xl">{siteContent.logoEmoji || "🐟"}</span>
                      <div className="text-[11px] text-stone-500 mt-2 font-semibold">Active Logo Emoji</div>
                    </div>

                    <div>
                      <label className="block font-bold text-stone-700 mb-1">Type or pick any Emoji</label>
                      <input
                        type="text"
                        value={siteContent.logoEmoji || "🐟"}
                        onChange={(e) => setSiteContent({ ...siteContent, logoEmoji: e.target.value })}
                        className="w-full border rounded-xl px-3 py-2 text-center text-2xl font-bold"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] text-stone-500 font-bold mb-1.5">Quick Suggestions:</label>
                      <div className="flex flex-wrap gap-2">
                        {["🐟", "🦐", "🦀", "🌊", "🌴", "🌿", "🏺", "🌶️", "🔥", "👑", "⭐", "✨"].map(em => (
                          <button
                            key={em}
                            type="button"
                            onClick={() => setSiteContent({ ...siteContent, logoEmoji: em })}
                            className="w-10 h-10 rounded-xl border bg-white hover:bg-stone-100 text-xl flex items-center justify-center transition"
                          >
                            {em}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <div className="pt-2">
                  <button
                    onClick={() => setEditingLogoModal(false)}
                    className="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-2.5 rounded-xl shadow text-xs"
                  >
                    Save Logo Settings ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= OWNER EMOJI CUSTOMIZER MODAL ================= */}
          {editingEmojiModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-stone-200 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <span className="bg-amber-100 text-amber-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">Emoji Customizer</span>
                    <h3 className="font-brand font-black text-lg text-stone-900 mt-1">Change Emoji</h3>
                  </div>
                  <button onClick={() => setEditingEmojiModal(null)} className="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
                </div>

                <div className="text-center py-2 bg-stone-50 rounded-2xl border">
                  <span className="text-4xl">{editingEmojiModal.value}</span>
                </div>

                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Type Any Emoji / Symbol:</label>
                  <input
                    type="text"
                    value={editingEmojiModal.value}
                    onChange={(e) => setEditingEmojiModal({ ...editingEmojiModal, value: e.target.value })}
                    className="w-full border rounded-xl px-3 py-2 text-center text-xl font-bold focus:ring-2 focus:ring-amber-500"
                    autoFocus
                  />
                </div>

                <div>
                  <label className="block text-[11px] text-stone-500 font-bold mb-1.5">Quick Choices:</label>
                  <div className="flex flex-wrap gap-2">
                    {["🐟", "🦐", "🦀", "🌊", "🌴", "🌿", "🏺", "🌶️", "🔥", "🧄", "💛", "⚡", "🛍️", "🛒", "👑", "✨", "⭐", "📦", "✓", "🙏"].map(em => (
                      <button
                        key={em}
                        type="button"
                        onClick={() => setEditingEmojiModal({ ...editingEmojiModal, value: em })}
                        className="w-9 h-9 rounded-xl border bg-white hover:bg-stone-100 text-lg flex items-center justify-center transition"
                      >
                        {em}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex gap-2 pt-2 border-t">
                  <button onClick={() => setEditingEmojiModal(null)} className="flex-1 py-2 border rounded-xl font-bold text-xs text-stone-600">Cancel</button>
                  <button
                    onClick={() => {
                      setSiteContent(prev => ({ ...prev, [editingEmojiModal.key]: editingEmojiModal.value }));
                      setEditingEmojiModal(null);
                    }}
                    className="flex-1 py-2 bg-amber-600 text-white rounded-xl font-bold text-xs shadow"
                  >
                    Save Emoji ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#051e34] text-sky-200 py-10 mt-auto text-xs border-t border-sky-900">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
              <h4 className="font-brand font-black text-xl text-white">
                {renderEditable("footerTitle", "Footer Brand Title", siteContent.footerTitle)}
              </h4>
              <p className="text-sky-300">
                {renderEditable("footerSubtitle", "Footer Subtitle", siteContent.footerSubtitle)}
              </p>
              <div className="text-[11px] text-sky-400 max-w-xl mx-auto">
                {renderEditable("footerNotice", "Footer Quality Notice", siteContent.footerNotice)}
              </div>
              <div className="text-[11px] text-sky-400 pt-1">
                UPI Auto Pay: <code className="text-amber-300">{ownerConfig.upiId}</code> • Free Delivery Above ₹{ownerConfig.freeDeliveryMin}
              </div>
              <div className="pt-2 text-sky-500">
                © {new Date().getFullYear()} {siteContent.storeTitle}. All rights reserved.
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
